<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>에브리업의원 로그인</title>
<!-- 앱스크립트 서버와의 연결을 미리 준비해서, 첫 API 요청이 조금이라도 더 빨리 응답하도록 합니다 -->
<link rel="preconnect" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.google.com">

<style>
  :root{
    --bg:#F1EEE8;
    --surface:#FFFFFF;
    --ink:#24282C;
    --muted:#8C9198;
    --line:#E5E0D7;
    --accent:#33625D;
    --accent-soft:#EAF0EE;
    --danger:#B0473C;
    --shadow:0 1px 2px rgba(30,30,30,.04),0 8px 24px rgba(40,50,48,.06);
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Pretendard','Pretendard Variable',-apple-system,system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:24px 18px;min-height:100dvh;
  }
  .app{width:100%;max-width:400px;transition:max-width .15s ease}
  .app.welcome-wide{max-width:520px}
  .app.welcome-wide .card{padding-left:14px;padding-right:14px}

  /* ── 브랜드 헤더 ── */
  .brand{text-align:center;margin-bottom:22px}
  .brand-logo{display:block;height:46px;width:auto;max-width:100%;margin:0 auto 8px}
  .brand .eyebrow{
    font-family:'Playfair Display',serif;
    letter-spacing:.34em;font-size:11px;color:var(--muted);
    text-transform:uppercase;margin:0 0 4px;padding-left:.34em;
  }
  .brand h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
  .brand .tag{font-size:15px;color:var(--muted);margin:9px 0 0;letter-spacing:-.01em}

  /* ── 카드 ── */
  .card{
    background:var(--surface);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 20px 24px;
  }
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .back{
    border:none;background:none;font-size:22px;line-height:1;color:var(--muted);
    padding:4px 8px 4px 0;cursor:pointer;margin-left:-4px;display:none;
  }
  .card-title{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
  .card-sub{font-size:13px;color:var(--muted);margin:2px 0 0;letter-spacing:-.01em}

  /* ── 이름 선택 ── */
  .names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .name-btn{
    background:var(--surface);border:1px solid var(--line);border-radius:15px;
    padding:16px 12px;text-align:center;cursor:pointer;transition:.12s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .name-btn:active{transform:scale(.97);background:var(--accent-soft);border-color:var(--accent)}
  .name-btn .nm{font-size:16px;font-weight:600;letter-spacing:-.02em}
  .name-btn .pt{font-size:12px;color:var(--muted)}
  .loading,.err-load{text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
  .err-load{color:var(--danger)}

  /* ── 비밀번호 입력 ── */
  .who{
    display:flex;align-items:baseline;gap:7px;justify-content:center;
    margin-bottom:20px;
  }
  .who .nm{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .who .pt{font-size:12.5px;color:var(--muted)}
  .dots{display:flex;gap:13px;justify-content:center;margin:6px 0 8px}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--line);transition:.15s}
  .dot.on{background:var(--accent);transform:scale(1.08)}
  .dot.err{background:var(--danger)}
  .msg{text-align:center;font-size:13px;min-height:20px;margin:10px 0 4px;letter-spacing:-.01em}
  .msg.bad{color:var(--danger)}
  .msg.hint{color:var(--muted)}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:12px}
  .key{
    background:var(--surface);border:1px solid var(--line);border-radius:15px;
    font-size:23px;font-weight:500;color:var(--ink);
    height:62px;cursor:pointer;transition:.1s;font-family:inherit;
  }
  .key:active{background:var(--accent-soft);transform:scale(.96);border-color:var(--accent)}
  .key.ghost{background:none;border:none;box-shadow:none;cursor:default}
  .key.util{font-size:15px;color:var(--muted);font-weight:600}
  .key:disabled{opacity:.4;pointer-events:none}

  /* ── 환영 화면 ── */
  .welcome{text-align:center;padding:14px 4px 6px}
  .welcome .check{
    width:56px;height:56px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 16px;
  }
  .welcome .w-name{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .welcome .w-part{font-size:13px;color:var(--muted);margin-top:4px}
  .welcome .w-msg{font-size:16px;font-weight:500;margin-top:14px;color:var(--ink)}
  .welcome .w-note{font-size:12.5px;color:var(--muted);margin-top:20px;line-height:1.6}
  .welcome-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;margin:20px auto 0}
  .btn-fill{
    display:flex;width:100%;min-height:58px;margin:0;background:var(--accent);border:none;
    color:#fff;border-radius:14px;padding:16px;font-size:16px;font-weight:600;
    cursor:pointer;font-family:inherit;letter-spacing:-.01em;align-items:center;justify-content:center;
  }
  .btn-fill:active{opacity:.9;transform:scale(.99)}
  .btn-line{
    display:inline-block;margin-top:12px;background:none;border:1px solid var(--line);
    color:var(--muted);border-radius:12px;padding:11px 20px;font-size:14px;
    cursor:pointer;font-family:inherit;
  }
  .btn-line:active{background:var(--accent-soft)}

  .btn-fill.app-off{background:#E3E3E3;color:#858585;cursor:not-allowed;box-shadow:none}
  .app-setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
  .app-switch{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--accent)}
  .app-switch input{appearance:none;-webkit-appearance:none;position:relative;width:38px;height:22px;border-radius:12px;margin:0;background:#C7CBC9;cursor:pointer;flex-shrink:0}
  .app-switch input::before{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:white;transition:transform .15s}
  .app-switch input:checked{background:var(--accent)}
  .app-switch input:checked::before{transform:translateX(16px)}
  .app-switch input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .app-switch input:disabled{opacity:.5;cursor:wait}
  #appSettingsPanel{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#FAFAF8}
  #appSettingsPanel h2{font-size:15px;margin:0 0 6px;text-align:left}
  #appSettingsStatus{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5;min-height:18px}
  [hidden]{display:none!important}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:18px;letter-spacing:.02em}

  @media(max-width:520px){
    .welcome-menu{gap:10px}
    .btn-fill{font-size:14px;padding:13px 8px;min-height:54px}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
const EVERYUP_LIVE = location.protocol === 'https:' && location.hostname === 'sikkakk.github.io';
if (EVERYUP_LIVE) {
  for (const href of ['https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css','https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap']) {
    const link=document.createElement('link'); link.rel='stylesheet'; link.href=href; document.head.appendChild(link);
  }
}
</script>
</head>
<body>
<div class="app" id="app">

  <div class="brand">
    <img class="brand-logo" src="logo.png" alt="에브리업의원"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <h1 class="brand-fallback" style="display:none">에브리업의원</h1>
    <p class="tag">안녕하십니까? 전문가의 손길 에브리업의원입니다.</p>
  </div>

  <div class="card">
    <div class="card-head" id="cardHead">
      <button class="back" id="backBtn" aria-label="뒤로">‹</button>
      <div>
        <p class="card-title" id="cardTitle">누구세요?</p>
        <p class="card-sub" id="cardSub">이름을 선택하세요</p>
      </div>
    </div>

    <!-- 이름 선택 -->
    <div id="viewNames">
      <div class="loading" id="nameLoading">불러오는 중…</div>
      <div class="names" id="nameGrid" style="display:none"></div>
    </div>

    <!-- 비밀번호 / 변경 (키패드 공용) -->
    <div id="viewPad" style="display:none">
      <div class="who"><span class="nm" id="whoName"></span><span class="pt" id="whoPart"></span></div>
      <div class="dots" id="dots"></div>
      <div class="msg hint" id="padMsg"></div>
      <div class="pad" id="pad"></div>
    </div>

    <!-- 환영 -->
    <div id="viewWelcome" style="display:none">
      <div class="welcome">
        <div class="check">✓</div>
        <div class="w-name" id="wName"></div>
        <div class="w-part" id="wPart"></div>
        <div class="w-msg">함께 만드는 에브리업, 오늘도 잘 부탁드립니다.</div>
        <div class="welcome-menu">
          <button class="btn-fill" id="goChecklist">✅ 셀프 체크리스트</button>
          <button class="btn-fill" id="goInventory">📦 재고 현황</button>
          <button class="btn-fill" id="goManual">📋 시술매뉴얼</button>
          <button class="btn-fill" id="goAttendance" style="display:none">🕐 직원관리</button>
          <button class="btn-fill" id="goReservation" style="display:none">📊 예약통계</button>
          <button class="btn-fill" id="goConsult" style="display:none">💳 상담전환관리</button>
          <button class="btn-fill" id="goIncentive" style="display:none">🧴 화장품관리 인센티브</button>
          <button class="btn-fill" id="goBotox" style="display:none">💉 잔여 보톡스 보고</button>
        </div>
        <p id="appSettingsStatus" role="status" aria-live="polite"></p>
        <button class="btn-line" id="appSettingsRetry" hidden>설정 다시 확인</button>
        <button class="btn-line" id="appSettingsBtn" hidden aria-expanded="false" aria-controls="appSettingsPanel">⚙ 앱 사용 설정</button>
        <section id="appSettingsPanel" hidden aria-labelledby="appSettingsTitle">
          <h2 id="appSettingsTitle">앱 사용 설정</h2>
          <div id="appSettingsRows"></div>
        </section>
        <button class="btn-line" id="logoutBtn">다른 계정으로</button>
      </div>
    </div>
  </div>

  <p class="foot">에브리업의원 내부 시스템</p>
</div>

<script>
/* ===== 백엔드 주소 (원장님 /exec) ===== */
const API = "https://script.google.com/macros/s/AKfycbwUBiyI9x4OfeexcM1nVbdIyOPeU2Uh6zGNn5r3tye11UfJLqi46aluwZb5r6-e5NqJ/exec";

/* ===== 로그인 후 이동할 앱 주소 ===== */
const INVENTORY_URL = "https://sikkakk.github.io/everyup/%EC%9E%AC%EA%B3%A0%EA%B4%80%EB%A6%AC.html";
const MANUAL_URL = "https://sikkakk.github.io/everyup/%EC%8B%9C%EC%88%A0%EB%A7%A4%EB%89%B4%EC%96%BC.html"; // 시술준비매뉴얼.html (구성원 모두)
const CHECKLIST_URL = "https://sikkakk.github.io/everyup/%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8.html";
const ATTENDANCE_URL = "https://sikkakk.github.io/everyup/%EC%A7%81%EC%9B%90%EA%B4%80%EB%A6%AC.html"; // 직원관리.html (송우철 원장님 전용)
const RESERVATION_URL = "https://sikkakk.github.io/everyup/%EC%98%88%EC%95%BD%ED%86%B5%EA%B3%84.html"; // 예약통계.html (원장·실장·부실장 전용)
const CONSULT_URL = "https://sikkakk.github.io/everyup/%EC%83%81%EB%8B%B4%EA%B2%B0%EC%A0%9C%EC%A0%84%ED%99%98.html"; // 상담결제전환.html (원장·실장 전용)
const INCENTIVE_URL = "https://sikkakk.github.io/everyup/%ED%99%94%EC%9E%A5%ED%92%88%EA%B4%80%EB%A6%AC%EC%9D%B8%EC%84%BC%ED%8B%B0%EB%B8%8C.html"; // 화장품관리인센티브.html (원장·실장·피부관리사 전용)
const BOTOX_URL = "https://sikkakk.github.io/everyup/%EC%9E%94%EC%97%AC%EB%B3%B4%ED%86%A1%EC%8A%A4%EB%B3%B4%EA%B3%A0.html"; // 잔여보톡스보고.html (원장·상담실장·간호조무사 전용)

/* ===== JSONP 헬퍼 (읽기 전용, CORS 우회) ===== */
function api(params){
  if (!EVERYUP_LIVE) return Promise.reject(new Error("preview"));
  params = {...params, _nonce:Date.now()+"_"+Math.random().toString(36).slice(2)};
  return new Promise((resolve,reject)=>{
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 12000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = (data)=>{ cleanup(); resolve(data); };
    const qs = Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
    const s = document.createElement("script");
    s.src = API + "?callback=" + cb + "&" + qs;
    s.onerror = ()=>{ cleanup(); reject(new Error("network")); };
    document.body.appendChild(s);
  });
}


/* ===== 1시간 공통 로그인 유지 ===== */
const GLOBAL_SESSION_KEY='everyup_global_session_v1';
const GLOBAL_SESSION_MS=(window.EVERYUP_CONFIG&&window.EVERYUP_CONFIG.sessionMs)||60*60*1000;
function saveGlobalSession(p,pw){
  try{localStorage.setItem(GLOBAL_SESSION_KEY,JSON.stringify({name:p.name,part:p.part||'',pw64:btoa(unescape(encodeURIComponent(pw||''))),at:Date.now(),expiresAt:Date.now()+GLOBAL_SESSION_MS}));}catch(e){}
}
function readGlobalSession(){
  try{const s=JSON.parse(localStorage.getItem(GLOBAL_SESSION_KEY)||'null');if(!s||!s.name||Date.now()>Number(s.expiresAt||0)){localStorage.removeItem(GLOBAL_SESSION_KEY);return null;}return s;}catch(e){return null;}
}
function clearGlobalSession(){try{localStorage.removeItem(GLOBAL_SESSION_KEY);}catch(e){}}
function decodePw64(s){try{return decodeURIComponent(escape(atob(s||'')));}catch(e){return '';}}

/* ===== 상태 ===== */
let STAFF = [];
let cur = null;                 // 선택된 사람 {name, part}
let mode = "login";             // login | change_new | change_confirm
let buf = "";                   // 입력 중인 숫자
let newPw = "";                 // 변경 시 첫 입력 저장
let busy = false;
let sessionPw = "";

/* ===== 요소 ===== */
const $ = id => document.getElementById(id);
const viewNames=$("viewNames"), viewPad=$("viewPad"), viewWelcome=$("viewWelcome");
const cardTitle=$("cardTitle"), cardSub=$("cardSub"), backBtn=$("backBtn");
const padMsg=$("padMsg"), dotsBox=$("dots");

/* ===== 화면 전환 ===== */
function show(view){
  $("app").classList.toggle("welcome-wide",view==="welcome");
  viewNames.style.display  = view==="names"  ? "" : "none";
  viewPad.style.display    = view==="pad"     ? "" : "none";
  viewWelcome.style.display= view==="welcome" ? "" : "none";
  backBtn.style.display    = view==="pad"     ? "block" : "none";
  $("cardHead").style.display = view==="welcome" ? "none" : "flex"; // 환영 화면에선 제목 줄 숨김
}

/* ===== 이름 목록 ===== */
async function loadNames(){
  if(!EVERYUP_LIVE){ $("nameLoading").textContent="미리보기 · 네트워크 차단 (운영 사이트에서 로그인하세요)"; return; }
  try{
    const r = await api({action:"list"});
    if(!r.ok) throw new Error(r.msg||"목록 오류");
    STAFF = r.list;
    const grid = $("nameGrid");
    grid.innerHTML = "";
    STAFF.forEach(p=>{
      const b = document.createElement("button");
      b.className = "name-btn";
      b.innerHTML = `<span class="nm">${p.name}</span><span class="pt">${p.part||""}</span>`;
      b.onclick = ()=>pickName(p);
      grid.appendChild(b);
    });
    $("nameLoading").style.display="none";
    grid.style.display="grid";
  }catch(e){
    $("nameLoading").className="err-load";
    $("nameLoading").textContent="연결에 실패했어요. 인터넷을 확인하고 새로고침 해주세요.";
  }
}

/* ===== 이름 선택 → 로그인 입력 ===== */
function pickName(p){
  cur = p; mode="login"; buf=""; newPw="";
  $("whoName").textContent = p.name;
  $("whoPart").textContent = p.part||"";
  cardTitle.textContent = "비밀번호";
  cardSub.textContent = "숫자 6자리를 눌러주세요";
  setMsg("", "hint");
  renderDots(); show("pad");
}

/* ===== 점(진행 표시) ===== */
function renderDots(err){
  dotsBox.innerHTML="";
  for(let i=0;i<6;i++){
    const d=document.createElement("div");
    d.className="dot"+(i<buf.length?" on":"")+(err?" err":"");
    dotsBox.appendChild(d);
  }
}
function setMsg(t,kind){ padMsg.textContent=t; padMsg.className="msg "+(kind||"hint"); }

/* ===== 키패드 ===== */
function buildPad(){
  const keys=["1","2","3","4","5","6","7","8","9","del","0","ok"];
  const pad=$("pad"); pad.innerHTML="";
  keys.forEach(k=>{
    const b=document.createElement("button");
    if(k==="del"){ b.className="key util"; b.textContent="지우기"; b.onclick=onDel; }
    else if(k==="ok"){ b.className="key ghost"; b.disabled=true; } // 6자리 되면 자동 진행
    else { b.className="key"; b.textContent=k; b.onclick=()=>onDigit(k); }
    pad.appendChild(b);
  });
}
function onDigit(n){
  if(busy || buf.length>=6) return;
  buf+=n; renderDots();
  if(buf.length===6) setTimeout(submit,120);
}
function onDel(){ if(busy||!buf.length) return; buf=buf.slice(0,-1); renderDots(); setMsg(currentHint(),"hint"); }
function currentHint(){
  if(mode==="change_new") return "새 비밀번호 6자리";
  if(mode==="change_confirm") return "한 번 더 입력";
  return "";
}
function shake(){
  renderDots(true);
  setTimeout(()=>{ buf=""; renderDots(); }, 550);
}

/* ===== 제출 처리 ===== */
async function submit(){
  if(busy || buf.length!==6 || !cur) return;
  const pw=buf;

  /* 1) 로그인 */
  if(mode==="login"){
    busy=true; setMsg("확인 중…","hint");
    try{
      const r=await api({action:"login",name:cur.name,pw});
      busy=false;
      if(!r.ok){ setMsg(r.msg||"비밀번호가 틀렸습니다.","bad"); shake(); return; }
      cur = {name:r.name,part:r.part||""};
      sessionPw=pw;
      if(r.mustChange){
        mode="change_new"; buf=""; newPw="";
        cardTitle.textContent="비밀번호 변경";
        cardSub.textContent="처음이시네요. 새 비밀번호를 정해주세요";
        setMsg("새 비밀번호 6자리 (000000 불가)","hint");
        renderDots();
      }else{
        sessionPw=pw;
        saveGlobalSession(cur,pw);
        welcome();
      }
    }catch(e){ busy=false; setMsg("연결이 불안정해요. 다시 눌러주세요.","bad"); shake(); }
    return;
  }

  /* 2) 새 비밀번호 1차 */
  if(mode==="change_new"){
    if(pw==="000000"){ setMsg("000000은 사용할 수 없어요.","bad"); shake(); return; }
    newPw=pw; mode="change_confirm"; buf="";
    setMsg("확인을 위해 한 번 더 입력","hint"); renderDots();
    return;
  }

  /* 3) 새 비밀번호 2차(확인) → 저장 */
  if(mode==="change_confirm"){
    if(pw!==newPw){
      setMsg("두 번 입력이 달라요. 처음부터 다시.","bad"); shake();
      mode="change_new"; newPw="";
      setTimeout(()=>setMsg("새 비밀번호 6자리 (000000 불가)","hint"),560);
      return;
    }
    busy=true; setMsg("저장 중…","hint");
    try{
      const r=await api({action:"change",name:cur.name,pw:newPw,oldPw:sessionPw});
      busy=false;
      if(!r.ok){ setMsg(r.msg||"변경 실패","bad"); shake(); mode="change_new"; newPw=""; return; }
      sessionPw=newPw;
      saveGlobalSession(cur,newPw);
      welcome();
    }catch(e){ busy=false; setMsg("연결이 불안정해요. 다시 시도해주세요.","bad"); shake(); }
    return;
  }
}

/* ===== 환영 ===== */
function welcome(){
  $("wName").textContent = cur.name + "님";
  $("wPart").textContent = cur.part||"";
  // 직원관리는 송우철 원장님으로 로그인했을 때만 표시
  const isDirector = cur.name==="송우철" || (cur.part||"").includes("원장");
  $("goAttendance").style.display = isDirector ? "block" : "none";
  // 예약통계는 원장·실장·부실장만 표시 (part에 '실장' 포함 시 상담실장·부실장 모두 해당)
  const RESV_NAMES = ["송우철","박수진","한희수"];
  const canResv = isDirector || RESV_NAMES.includes(cur.name) || (cur.part||"").includes("실장");
  $("goReservation").style.display = canResv ? "block" : "none";
  // 상담전환관리는 원장·실장만 (부실장 제외)
  const CONSULT_NAMES = ["송우철","박수진"];
  const isSiljang = (cur.part||"").includes("실장") && !(cur.part||"").includes("부실장");
  const canConsult = isDirector || isSiljang || CONSULT_NAMES.includes(cur.name);
  $("goConsult").style.display = canConsult ? "block" : "none";
  // 화장품관리 인센티브는 원장·실장·피부관리사만 (부실장·간호 제외)
  const INCENTIVE_NAMES = ["송우철","박수진","이효정","김유미"];
  const isSkin = (cur.part||"").includes("피부");
  const canIncentive = isDirector || isSiljang || isSkin || INCENTIVE_NAMES.includes(cur.name);
  $("goIncentive").style.display = canIncentive ? "block" : "none";
  // 잔여 보톡스 보고는 원장·상담실장·간호조무사만 (부실장·피부관리사 제외)
  const isNurseAsst = (cur.part||"").includes("간호");
  const canBotox = isDirector || isSiljang || isNurseAsst;
  $("goBotox").style.display = canBotox ? "block" : "none";
  show("welcome");
  // 직전에 확인했던 앱 사용 상태가 있으면 클라우드 응답을 기다리지 않고 먼저 화면에 반영합니다.
  // (아래 refreshAppSettings()가 이어서 최신 상태로 다시 확인/보정합니다)
  const cached = loadCachedAppState(cur.name);
  if(cached){
    appState=cached.apps; appRevision=cached.revision; appCanManage=!!cached.canManage;
    renderAppSettings();
  }
  refreshAppSettings();
}

/* ===== 로그인 메뉴 전용 클라우드 사용 설정 ===== */
const MENU_APPS = [
  ['checklist','goChecklist','셀프 체크리스트'],
  ['inventory','goInventory','재고 현황'],
  ['manual','goManual','시술매뉴얼'],
  ['attendance','goAttendance','직원관리'],
  ['reservation','goReservation','예약통계'],
  ['consult','goConsult','상담전환관리'],
  ['incentive','goIncentive','화장품관리 인센티브'],
  ['botox','goBotox','잔여 보톡스 보고']
];
let appState=null, appRevision=0, appCanManage=false, appSaving=false, appNavigating=false;
let appRequest=0;
let appStateFetchedAt=0; // 마지막으로 클라우드에서 확인에 성공한 시각 (성능 개선용)
const APP_STATE_FRESH_MS=8000; // 이 시간 안에 이미 확인했다면, 버튼 클릭 시 재확인 없이 바로 이동합니다
const APP_STATE_CACHE_KEY='everyup_appstate_cache_v1';
function loadCachedAppState(name){
  try{
    const c=JSON.parse(localStorage.getItem(APP_STATE_CACHE_KEY)||'null');
    if(c && c.name===name && c.apps && Number.isInteger(c.revision)) return c;
  }catch(e){}
  return null;
}
function saveCachedAppState(name,apps,revision,canManage){
  try{ localStorage.setItem(APP_STATE_CACHE_KEY, JSON.stringify({name,apps,revision,canManage,at:Date.now()})); }catch(e){}
}
function setAppStatus(text){ $('appSettingsStatus').textContent=text; }
function activeMenuSession(){
  const s=readGlobalSession();
  return !!(EVERYUP_LIVE && cur && s && s.name===cur.name);
}
function resetAppSettings(){
  ++appRequest; appState=null; appCanManage=false; appSaving=false; appNavigating=false; appStateFetchedAt=0;
  $('appSettingsPanel').hidden=true; $('appSettingsBtn').setAttribute('aria-expanded','false');
  renderAppSettings();
}
function expireMenu(){
  $('logoutBtn').click();
  alert('로그인 유지 시간이 끝났거나 인증이 변경되었습니다. 다시 로그인해 주세요.');
}
function renderAppSettings(){
  for(const [key,id] of MENU_APPS){
    const off=!appState || appState[key]!==true;
    $(id).classList.toggle('app-off',off);
    $(id).setAttribute('aria-disabled',String(off));
    $(id).title=!appState ? '앱 사용 상태 확인 필요' : off ? '현재 사용 중지된 앱입니다' : '';
  }
  $('appSettingsBtn').hidden=!appCanManage;
  if(!appCanManage) $('appSettingsPanel').hidden=true;
  const rows=$('appSettingsRows'); rows.replaceChildren();
  if(!appCanManage) return;
  for(const [key,,label] of MENU_APPS){
    const row=document.createElement('label'); row.className='app-setting-row';
    const title=document.createElement('span'); title.textContent=label;
    const control=document.createElement('span'); control.className='app-switch';
    const input=document.createElement('input'); input.type='checkbox'; input.setAttribute('role','switch');
    input.setAttribute('aria-label',label+' 사용'); input.checked=!!(appState && appState[key]);
    input.disabled=appSaving || !appState;
    const state=document.createElement('span'); state.textContent=input.checked?'사용':'사용중지';
    input.onchange=()=>saveAppSetting(key,input.checked);
    control.append(input,state); row.append(title,control); rows.appendChild(row);
  }
}
function acceptAppSettings(r){
  if(!r.apps || !Number.isInteger(r.revision)) throw new Error('invalid settings');
  const apps = Object.assign({}, r.apps);
  // 백엔드가 아직 모르는 앱 키(예: 새로 추가된 앱)는 막지 않고 기본으로 '사용' 처리합니다.
  MENU_APPS.forEach(([key])=>{ if(typeof apps[key] !== 'boolean') apps[key] = true; });
  appState=apps; appRevision=r.revision; appCanManage=r.canManage===true;
  appStateFetchedAt=Date.now();
  if(cur) saveCachedAppState(cur.name, appState, appRevision, appCanManage);
  $('appSettingsRetry').hidden=true;
  renderAppSettings();
}
async function refreshAppSettings(){
  if(appSaving) return false;
  if(!activeMenuSession()){ if(cur) expireMenu(); return false; }
  const person=cur, request=++appRequest;
  if(!appState) setAppStatus('앱 사용 상태 확인 중…');
  try{
    const r=await api({action:'appSettings',name:person.name,pw:sessionPw});
    if(request!==appRequest || cur!==person) return false;
    if(!activeMenuSession()){expireMenu();return false;}
    if(!r.ok){if(r.code==='AUTH'){expireMenu();return false;}throw new Error(r.msg);}
    acceptAppSettings(r); setAppStatus('클라우드 설정 적용됨'); return true;
  }catch(e){
    if(request!==appRequest || cur!==person) return false;
    appState=null; appCanManage=false; appStateFetchedAt=0; renderAppSettings();
    $('appSettingsRetry').hidden=false;
    setAppStatus('앱 사용 상태를 확인하지 못했습니다. 다시 확인해 주세요.');
    return false;
  }
}
async function saveAppSetting(key,enabled){
  if(appSaving || !appCanManage) return;
  if(!activeMenuSession()){expireMenu();return;}
  const person=cur;
  appSaving=true; ++appRequest; renderAppSettings(); setAppStatus('클라우드에 저장 중…');
  let problem='';
  try{
    const r=await api({action:'setAppSetting',name:person.name,pw:sessionPw,app:key,enabled:String(enabled),revision:appRevision});
    if(cur!==person) return;
    if(!activeMenuSession()){expireMenu();return;}
    if(!r.ok){if(r.code==='AUTH'){expireMenu();return;}throw new Error(r.msg||'저장 실패');}
    acceptAppSettings(r); setAppStatus('저장됨 · 모든 컴퓨터에 적용됩니다.');
  }catch(e){
    if(cur===person) problem=e.message==='network'||e.message==='timeout' ? '저장 결과를 확인하지 못했습니다. 최신 상태를 다시 확인합니다.' : e.message;
  }finally{
    if(cur===person){appSaving=false;renderAppSettings();}
  }
  if(problem && cur===person){
    await refreshAppSettings();
    if(cur===person) setAppStatus(problem+' 현재 표시된 상태를 확인해 주세요.');
  }
}
$('appSettingsBtn').onclick=async()=>{
  if(appSaving) return;
  if(!await refreshAppSettings() || !appCanManage) return;
  $('appSettingsPanel').hidden=!$('appSettingsPanel').hidden;
  $('appSettingsBtn').setAttribute('aria-expanded',String(!$('appSettingsPanel').hidden));
};
$('appSettingsRetry').onclick=()=>refreshAppSettings();
// 기존 이동 함수를 보존하고, 어떤 인증 신호도 쓰기 전에 최신 클라우드 상태를 확인합니다.
// (단, 방금 확인한 상태가 있다면 매번 다시 왕복하지 않고 바로 이동해 체감 속도를 높입니다)
for(const [key,id] of MENU_APPS){
  const button=$(id), original=button.onclick;
  button.onclick=null;
  button.addEventListener('click',async event=>{
    event.preventDefault(); event.stopImmediatePropagation();
    if(appNavigating || appSaving) return;
    if(!activeMenuSession()){expireMenu();return;}
    appNavigating=true;
    try{
      const isFresh = appState && (Date.now()-appStateFetchedAt) < APP_STATE_FRESH_MS;
      if(!isFresh){
        if(!await refreshAppSettings()) return;
      }
      if(appState[key]!==true){alert('현재 사용 중지된 앱입니다');return;}
      if(button.style.display==='none') return;
      original.call(button,event);
    }finally{appNavigating=false;}
  },true);
}
window.addEventListener('focus',()=>{if(cur && viewWelcome.style.display!=='none' && !appSaving && !appNavigating) refreshAppSettings();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden && cur && viewWelcome.style.display!=='none' && !appSaving && !appNavigating) refreshAppSettings();});
window.addEventListener('storage',e=>{
  if(e.key===GLOBAL_SESSION_KEY && cur && viewWelcome.style.display!=='none' && !activeMenuSession()) expireMenu();
});
setInterval(()=>{if(!document.hidden && cur && viewWelcome.style.display!=='none' && !appSaving && !appNavigating) refreshAppSettings();},30000);
renderAppSettings();

/* ===== 시작 ===== */
buildPad();

if(remembered){
  cur={name:remembered.name,part:remembered.part||''}; sessionPw=decodePw64(remembered.pw64||'');
  // 각 앱에서 기존 인증 신호를 재사용할 수 있도록 1시간 세션을 전달
  try{
    sessionStorage.setItem('everyup_checklist_user',JSON.stringify({name:cur.name,part:cur.part||'',pw:sessionPw,at:Date.now()}));
    sessionStorage.setItem('everyup_manual_user',JSON.stringify({name:cur.name,part:cur.part||'',at:Date.now()}));
    sessionStorage.setItem('everyup_att_ok',String(Date.now())); sessionStorage.setItem('everyup_resv_ok',String(Date.now()));
    sessionStorage.setItem('everyup_consult_ok',String(Date.now())); sessionStorage.setItem('everyup_incentive_ok',String(Date.now()));
    sessionStorage.setItem('everyup_botox_ok',String(Date.now()));
  }catch(e){}
  welcome();
}else{show('names');loadNames();}
