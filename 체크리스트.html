let session=null, token="", model={items:[],records:{},isAdmin:false,isDirector:false,canStats:false,staff:[],viewUser:""}, busy=false, activePeriod="daily", editingItemId="", draggedItemId="", draggedCycle="", activeView="checklist", settingsMode=false, statsPeriod="daily", statsAnchor=todayIso(), statsData=null, statsBusy=false, viewDate=todayIso();

function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}
function jsonp(params){if(!LIVE)return Promise.reject(new Error("미리보기에서는 연결하지 않습니다."));return new Promise((resolve,reject)=>{const cb="cl_"+Math.random().toString(36).slice(2);const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"))},120000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error("network"))};s.src=CHECKLIST_API+"?_="+Date.now()+"&callback="+cb+"&"+Object.entries(params).map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v??"")).join("&");document.body.appendChild(s)})}
async function post(body){if(!LIVE)throw new Error('미리보기에서는 저장하지 않습니다.');const requestId=crypto.randomUUID();await fetch(CHECKLIST_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,requestId})});for(let n=0;n<30;n++){const r=await jsonp({action:'mutationStatus',token,requestId});if(r.pending){await new Promise(resolve=>setTimeout(resolve,1000));continue;}if(!r.ok)throw new Error(r.msg||'저장 실패');return r;}throw new Error('저장 결과 확인 시간이 초과되었습니다. 새로고침 후 확인하세요.');}
function readSession(){try{const g=JSON.parse(localStorage.getItem('everyup_global_session_v1')||'null');if(g&&g.name&&g.expiresAt>Date.now()&&g.pw64)return{name:g.name,part:g.part,pw:decodeURIComponent(escape(atob(g.pw64))),at:g.at||Date.now()};const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');return s&&s.name&&s.pw&&Date.now()-s.at<3600000?s:null;}catch(e){return null;}}
function signOut(){try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}location.replace(LOGIN_URL)}
function checklistTabKey(){try{const g=JSON.parse(localStorage.getItem('everyup_global_session_v1')||'null');const n=(g&&g.expiresAt>Date.now()&&g.name)||'';return 'everyup_lasttab_체크리스트_'+(n||'default')}catch(e){return 'everyup_lasttab_체크리스트_default'}}

async function start(){if(!LIVE){$("status").textContent="미리보기 · 네트워크 차단. 운영 사이트에서 로그인하세요.";return;}session=readSession();if(!session){signOut();return}if(CHECKLIST_API.includes("__CHECKLIST")){showSetup();return}try{const r=await jsonp({action:"auth",name:session.name,pw:session.pw});if(!r.ok)throw new Error(r.msg||"인증 실패");token=r.token;await load();restoreChecklistTab()}catch(e){$("status").textContent="로그인 확인에 실패했습니다. 메뉴로 돌아가 다시 로그인해주세요."}}
function showSetup(){$("status").className="setup";$("status").innerHTML="체크리스트 백엔드 연결 전입니다.<code>체크리스트_백엔드.gs를 Apps Script로 배포한 뒤 웹앱 주소를 연결하세요.</code>"}
async function load(target){const r=await jsonp({action:"load",token,targetUser:target||model.viewUser||"",date:viewDate});if(!r.ok){if(r.code==="AUTH")signOut();throw new Error(r.msg||"불러오기 실패")}model=r;if(model.viewDate)viewDate=model.viewDate;render()}
function periodItems(items,key){if(key==="all")return items;if(key==="weekly")return items.filter(x=>x.cycle==="매주");if(key==="monthly")return items.filter(x=>x.cycle==="매월");if(key==="quarterly")return items.filter(x=>x.cycle==="분기");return items.filter(x=>["매일","오전","상담중","응대중","시술중","관리중","오후","필요시"].includes(x.cycle))}
function periodStat(items,records){const done=items.filter(x=>records[x.itemId]?.checked).length;return{done,total:items.length,rate:items.length?Math.round(done/items.length*100):0}}
function renderPeriodNav(items,records){const defs=[["daily","매일"],["weekly","매주"],["monthly","매월"],["quarterly","분기"],["all","전체"]];$("periodNav").innerHTML=defs.map(([key,label])=>{const s=periodStat(periodItems(items,key),records);return`<button class="periodbtn ${activePeriod===key?"active":""}" data-period="${key}"><strong>${label}</strong><span><b>${s.done} / ${s.total}</b><small>${s.rate}% 완료</small></span></button>`}).join("");document.querySelectorAll(".periodbtn").forEach(btn=>btn.onclick=()=>periodBtnClick(btn.dataset.period))}
async function periodBtnClick(key){if(busy)return;activePeriod=key;if(key==="daily"&&model.viewDate&&model.viewDate!==todayIso()){viewDate=todayIso();busy=true;render();try{await load(model.viewUser);}catch(e){toast("불러오지 못했습니다.");}finally{busy=false;render();}}else{render();}}
async function shiftDay(step){if(busy)return;const base=model.viewDate||viewDate||todayIso();const[y,m,d]=base.split("-").map(Number);const next=isoFromUtc(new Date(Date.UTC(y,m-1,d+step)));if(next>todayIso())return;viewDate=next;busy=true;render();try{await load(model.viewUser);}catch(e){toast("불러오지 못했습니다.");}finally{busy=false;render();}}
function dayNavInlineHtml(isToday){return `<span class="day-nav-inline"><button class="day-step-sm" data-daydir="-1" aria-label="전날" ${busy?"disabled":""}>‹</button><button class="day-step-sm" data-daydir="1" aria-label="다음날" ${busy||isToday?"disabled":""}>›</button></span>${isToday?"":'<span class="day-readonly">조회만 가능</span>'}`}
function render(){const isOwn=!model.isAdmin||model.viewUser===session.name;$("status").style.display="none";$("dashboard").hidden=false;$("modeTabs").hidden=!model.canStats;$("saveNowBtn").hidden=!model.isDirector;$("backupBtn").hidden=!model.isDirector;$("importBtn").hidden=!model.isDirector;$("settingsBtn").hidden=!model.isDirector;$("settingsBtn").classList.toggle("active",model.isDirector&&settingsMode);$("addBtn").hidden=!model.isDirector||!settingsMode;if(!model.canStats&&activeView==="stats")activeView="checklist";if(model.isDirector){const sel=$("staffSelect");sel.innerHTML=model.staff.map(x=>`<option value="${esc(x.name)}" ${x.name===model.viewUser?"selected":""}>${esc(x.name)} - ${esc(x.part)}</option>`).join("")}const allItems=model.items||[],records=model.records||{};renderPeriodNav(allItems,records);const dailyReadOnly=activePeriod==="daily"&&!!model.viewDate&&model.viewDate!==todayIso();const items=periodItems(allItems,activePeriod);const order=["매일","오전","상담중","응대중","시술중","관리중","오후","매주","매월","분기","필요시"];const grouped={};items.forEach(x=>(grouped[x.cycle]??=[]).push(x));const isDailyTab=activePeriod==="daily";const vd=model.viewDate||viewDate||todayIso();const isViewToday=vd===todayIso();const dateLabel=dailyReadOnly?new Date(model.viewDate+"T12:00:00+09:00").toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric"}):todayLabel();$("groups").innerHTML=order.filter(c=>grouped[c]?.length).map(c=>`<section class="group"><div class="grouphead"><h2>${cycleTitle(c)}${c==="매일"?`<em class="group-date">${dateLabel}</em>`:""}</h2><span>${grouped[c].length}개</span>${c==="매일"&&isDailyTab?dayNavInlineHtml(isViewToday):""}</div><div class="list">${grouped[c].map(x=>itemHtml(x,records[x.itemId],isOwn&&!dailyReadOnly)).join("")}</div></section>`).join("")||'<div class="empty">등록된 체크리스트가 없습니다.</div>';document.querySelectorAll(".check").forEach(el=>el.addEventListener("change",()=>{if(busy){el.checked=!el.checked;return}el.closest(".item").classList.toggle("done",el.checked);toggle(el.dataset.id,el.checked)}));document.querySelectorAll(".item.clickable").forEach(card=>{card.addEventListener("click",e=>{if(busy||e.target.closest("input,button,a,select,.drag-handle"))return;const box=card.querySelector(".check");if(!box||box.disabled)return;box.checked=!box.checked;box.dispatchEvent(new Event("change",{bubbles:true}))});card.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!e.target.closest("input,button,a,select,.drag-handle")){e.preventDefault();card.click()}})});document.querySelectorAll(".del").forEach(el=>el.addEventListener("click",()=>removeItem(el.dataset.id)));document.querySelectorAll(".edit").forEach(el=>el.addEventListener("click",()=>openEdit(el.dataset.id)));document.querySelectorAll(".cycle-control").forEach(el=>el.onchange=()=>changeCycle(el.dataset.id,el.value));document.querySelectorAll(".day-step-sm").forEach(el=>el.onclick=()=>shiftDay(Number(el.dataset.daydir)));bindDragHandlers();renderMode();syncControls()}
function renderMode(){const showStats=activeView==="stats"&&model.canStats;$("checkView").hidden=showStats;$("statsView").hidden=!showStats;$("checklistTab").classList.toggle("active",!showStats);$("statsTab").classList.toggle("active",showStats);$("adminActions").hidden=showStats||!model.isDirector;if(showStats){$("pageTitle").textContent="직원 체크 통계";$("pageSub").textContent="직원별 완료 현황을 기간별로 확인합니다.";$("pageSub").style.display=""}else{const isOwn=!model.isAdmin||model.viewUser===session.name;$("pageTitle").textContent=model.viewUser+" "+model.viewRole;$("pageSub").textContent=isOwn?"항목이나 체크박스를 누르면 날짜·시간과 이름이 자동 저장됩니다.":"";$("pageSub").style.display=isOwn?"":"none"}}
function switchView(view){if(view==="stats"&&!model.canStats)return;if(view==="stats")settingsMode=false;activeView=view;render();if(view==="stats")loadStats()}
function toggleSettings(){if(!model.isDirector||busy)return;if(activeView==="stats")activeView="checklist";settingsMode=!settingsMode;render()}
// 체크리스트 본 화면은 오늘만 편집합니다. 과거 기록 조회는 직원 통계에서만 가능하며 통계 화면에는 체크/수정 동작이 없습니다. 미래 날짜 체크리스트는 열지 않습니다.
function todayIso(){const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const p={};parts.forEach(x=>p[x.type]=x.value);return`${p.year}-${p.month}-${p.day}`}
function todayLabel(){return new Date().toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric"})}
function isoFromUtc(d){return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`}
function shiftStats(step){if(statsBusy)return;const [y,m,d]=statsAnchor.split("-").map(Number);if(statsPeriod==="daily"||statsPeriod==="all"){statsAnchor=isoFromUtc(new Date(Date.UTC(y,m-1,d+step)))}else if(statsPeriod==="weekly"){statsAnchor=isoFromUtc(new Date(Date.UTC(y,m-1,d+step*7)))}else{const months=statsPeriod==="quarterly"?step*3:step;statsAnchor=isoFromUtc(new Date(Date.UTC(y,m-1+months,1)))}statsData=null;loadStats()}
function renderStatsControls(){const defs=[["daily","매일"],["weekly","매주"],["monthly","매월"],["quarterly","분기"],["all","전체"]];$("statsPeriodNav").innerHTML=defs.map(([key,label])=>`<button class="stats-periodbtn ${statsPeriod===key?"active":""}" data-period="${key}" ${statsBusy?"disabled":""}>${label}</button>`).join("");document.querySelectorAll(".stats-periodbtn").forEach(btn=>btn.onclick=()=>{if(statsBusy)return;statsPeriod=btn.dataset.period;statsData=null;loadStats()});const monthInput=statsPeriod==="monthly"||statsPeriod==="quarterly";const pickerValue=monthInput?statsAnchor.slice(0,7):statsAnchor;$("statsControls").innerHTML=`<button class="stats-step" id="statsPrev" aria-label="이전 기간" ${statsBusy?"disabled":""}>‹</button><input class="stats-picker" id="statsPicker" type="${monthInput?"month":"date"}" value="${pickerValue}" ${statsBusy?"disabled":""}><button class="stats-step" id="statsNext" aria-label="다음 기간" ${statsBusy?"disabled":""}>›</button><strong class="stats-label" id="statsRangeLabel">${esc(statsData?.periodLabel||"기간을 불러오는 중입니다…")}</strong>`;$("statsPrev").onclick=()=>shiftStats(-1);$("statsNext").onclick=()=>shiftStats(1);$("statsPicker").onchange=e=>{if(statsBusy||!e.target.value)return;statsAnchor=monthInput?e.target.value+"-01":e.target.value;statsData=null;loadStats()}}
async function loadStats(){if(!model.canStats||statsBusy)return;statsBusy=true;renderStatsControls();$("statsContent").className="stats-loading";$("statsContent").textContent="통계를 불러오는 중입니다…";try{const r=await jsonp({action:"stats",token,period:statsPeriod,anchorDate:statsAnchor});if(!r.ok){if(r.code==="AUTH")signOut();throw new Error(r.msg||"통계 오류")}statsAnchor=r.anchorDate||statsAnchor;statsData=r;renderStatsControls();renderStatsContent()}catch(e){$("statsContent").className="stats-loading stats-error";$("statsContent").textContent="통계를 불러오지 못했습니다."}finally{statsBusy=false;renderStatsControls()}}
function renderStatsContent(){if(!statsData)return;const rows=statsData.rows||[],summary=statsData.summary||{done:0,total:0,rate:0};const completeStaff=rows.filter(x=>x.total>0&&x.done===x.total).length;$("statsContent").className="";$("statsContent").innerHTML=`<div class="stats-summary"><div class="stats-card"><small>전체 완료 항목</small><strong>${summary.done} / ${summary.total}</strong></div><div class="stats-card"><small>전체 완료율</small><strong>${summary.rate}%</strong></div><div class="stats-card"><small>모두 완료한 직원</small><strong>${completeStaff}명</strong></div></div><div class="stats-table-wrap"><table class="stats-table"><thead><tr><th>직원</th><th>직무</th><th>완료 항목</th><th>완료율</th></tr></thead><tbody>${rows.map(row=>{const rate=Math.max(0,Math.min(100,Number(row.rate)||0));return`<tr><td class="stats-name">${esc(row.name)}</td><td>${esc(row.part)}</td><td>${row.done} / ${row.total}</td><td><div class="stats-rate"><div class="stats-bar"><i style="width:${rate}%"></i></div><b>${rate}%</b></div></td></tr>`}).join("")||'<tr><td colspan="4">표시할 직원이 없습니다.</td></tr>'}</tbody></table></div>`}
function cycleTitle(c){return({"매일":"📅 매일","오전":"🌅 오전","상담중":"💬 상담 중","응대중":"🛎️ 응대 중","시술중":"💉 시술 중","관리중":"🧴 관리 중","오후":"🌆 오후 마감","매주":"📋 매주","매월":"📊 매월","분기":"🔍 분기","필요시":"🔧 필요 시"})[c]||c}
function itemHtml(x,r,isOwn){const done=!!r?.checked;const meta=done?`<div class="meta">${formatDate(r.actionAt)} · ${esc(r.actionBy)}</div>`:"";const directorActions=model.isDirector&&settingsMode?`<select class="cycle-control" aria-label="항목 주기" data-id="${esc(x.itemId)}">${["매일","오전","상담중","응대중","시술중","관리중","오후","매주","매월","분기","필요시"].map(c=>`<option ${c===x.cycle?"selected":""}>${c}</option>`).join("")}</select><span class="drag-handle" draggable="true" data-id="${x.itemId}" title="마우스로 끌어 순서 변경" aria-label="마우스로 끌어 순서 변경">⋮⋮</span><button class="edit" data-id="${x.itemId}">수정</button><button class="del" data-id="${x.itemId}">삭제</button>`:"";return `<article class="item ${done?"done":""} ${isOwn?"clickable":""}" data-id="${x.itemId}" data-cycle="${esc(x.cycle)}" ${isOwn?'tabindex="0" role="button"':""}><input class="check" type="checkbox" data-id="${x.itemId}" ${done?"checked":""} ${!isOwn||busy?"disabled":""}><div><div class="itemtext">${esc(x.text)}</div>${meta}</div>${directorActions?`<div class="itemactions">${directorActions}</div>`:""}</article>`}
function clearDragStyles(){document.querySelectorAll(".item").forEach(el=>el.classList.remove("dragging","drop-before","drop-after"))}
function bindDragHandlers(){if(!model.isDirector)return;document.querySelectorAll(".drag-handle").forEach(handle=>{handle.addEventListener("dragstart",e=>{draggedItemId=handle.dataset.id;const card=handle.closest(".item");draggedCycle=card.dataset.cycle;card.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",draggedItemId)});handle.addEventListener("dragend",()=>{draggedItemId="";draggedCycle="";clearDragStyles()})});document.querySelectorAll(".item").forEach(card=>{card.addEventListener("dragover",e=>{if(!draggedItemId||card.dataset.id===draggedItemId||card.dataset.cycle!==draggedCycle)return;e.preventDefault();clearDragStyles();const source=document.querySelector(`.item[data-id="${CSS.escape(draggedItemId)}"]`);if(source)source.classList.add("dragging");const after=e.clientY>card.getBoundingClientRect().top+card.offsetHeight/2;card.classList.add(after?"drop-after":"drop-before");e.dataTransfer.dropEffect="move"});card.addEventListener("drop",e=>{if(!draggedItemId||card.dataset.id===draggedItemId||card.dataset.cycle!==draggedCycle)return;e.preventDefault();const after=card.classList.contains("drop-after");const sourceId=draggedItemId,targetId=card.dataset.id;draggedItemId="";draggedCycle="";clearDragStyles();reorderByDrop(sourceId,targetId,after)})})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[m])}
function formatDate(v){if(!v)return"";const d=new Date(v);return d.toLocaleString("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
async function toggle(itemId,checked){if(busy)return;if(activePeriod==="daily"&&model.viewDate&&model.viewDate!==todayIso())return;busy=true;try{await post({action:"toggle",token,itemId,checked});toast(checked?"체크했습니다.":"체크를 해제했습니다.");await new Promise(r=>setTimeout(r,600));busy=false;await load(model.viewUser)}catch(e){toast("저장하지 못했습니다.");busy=false;await load(model.viewUser)}finally{busy=false}}
async function reorderByDrop(sourceId,targetId,after){if(!model.isDirector||busy)return;const source=model.items.find(x=>x.itemId===sourceId),target=model.items.find(x=>x.itemId===targetId);if(!source||!target||source.cycle!==target.cycle)return;const ordered=model.items.filter(x=>x.cycle===source.cycle).sort((a,b)=>a.sortOrder-b.sortOrder);const sourceIndex=ordered.findIndex(x=>x.itemId===sourceId);if(sourceIndex<0)return;const moved=ordered.splice(sourceIndex,1)[0];const targetIndex=ordered.findIndex(x=>x.itemId===targetId);ordered.splice(targetIndex+(after?1:0),0,moved);busy=true;try{await post({action:"reorderItems",token,itemIds:ordered.map(x=>x.itemId)});toast("순서를 변경했습니다.");await new Promise(r=>setTimeout(r,600));busy=false;await load(model.viewUser)}catch(e){toast("순서를 변경하지 못했습니다.");busy=false;await load(model.viewUser)}finally{busy=false}}
async function removeItem(itemId){if(!confirm("이 항목을 삭제할까요? 기존 완료 기록은 보존됩니다."))return;await post({action:"deleteItem",token,itemId});toast("삭제했습니다.");await new Promise(r=>setTimeout(r,600));await load(model.viewUser)}
async function addItem(){const role=$("newRole").value,cycle=$("newCycle").value,text=$("newText").value.trim();if(!text){toast("체크 항목을 입력해주세요.");return}await post({action:"addItem",token,role,cycle,text});$("modal").classList.remove("show");$("newText").value="";toast("항목을 추가했습니다.");await new Promise(r=>setTimeout(r,600));await load(model.viewUser)}
function openEdit(itemId){if(!model.isDirector)return;const item=model.items.find(x=>x.itemId===itemId);if(!item)return;editingItemId=itemId;$("editRole").value=item.role;$("editCycle").value=item.cycle;$("editText").value=item.text;$("editModal").classList.add("show")}
async function saveEdit(){const text=$("editText").value.trim();if(!text){toast("체크 항목을 입력해주세요.");return}await post({action:"editItem",token,itemId:editingItemId,role:$("editRole").value,cycle:$("editCycle").value,text});$("editModal").classList.remove("show");toast("수정했습니다.");await new Promise(r=>setTimeout(r,600));await load(model.viewUser)}
async function saveNow(){return makeBackup("excelBackup");}
async function backupNow(){return makeBackup("backup");}
async function importBackup(file){if(!model.isDirector||!file)return;try{const text=await file.text();const data=JSON.parse(text);if(!confirm("이 백업을 가져오면 현재 체크리스트 데이터가 교체됩니다. 계속할까요?"))return;await post({action:"importBackup",token,backup:data});toast("가져오기를 요청했습니다.");await new Promise(r=>setTimeout(r,1200));await load(model.viewUser)}catch(e){toast("올바른 체크리스트 JSON 파일인지 확인해주세요.")}finally{$("importFile").value=""}}
$("checklistTab").onclick=()=>switchView("checklist");$("statsTab").onclick=()=>switchView("stats");
$("staffSelect").addEventListener("change",e=>{model.viewUser=e.target.value;activePeriod="daily";viewDate=todayIso();load(model.viewUser).catch(()=>toast("불러오지 못했습니다."))});$("addBtn").onclick=()=>$("modal").classList.add("show");$("cancelBtn").onclick=()=>$("modal").classList.remove("show");$("saveBtn").onclick=addItem;$("editCancelBtn").onclick=()=>$("editModal").classList.remove("show");$("editSaveBtn").onclick=saveEdit;$("saveNowBtn").onclick=saveNow;$("backupBtn").onclick=backupNow;$("importBtn").onclick=()=>$("importFile").click();$("settingsBtn").onclick=toggleSettings;$("importFile").addEventListener("change",e=>importBackup(e.target.files[0]));$("backBtn").onclick=()=>location.href=LOGIN_URL;
</script>
<script>
function euSetTopStatus(text,state){$('euTopStatusText').textContent=text;$('euTopStatus').dataset.s=state;}
function syncControls(){
 for(const id of ['euExcelBtn','euJsonBtn','euGearBtn'])$(id).hidden=!model.isDirector;
 $('euGearBtn').classList.toggle('active',settingsMode);
 $('addBtn').hidden=!model.isDirector||!settingsMode||activeView==='stats';
 $('modeTabs').hidden=false;$('statsTab').hidden=!model.canStats;
 $('euChecklistSettings').textContent=settingsMode?'설정 종료':'설정';
}
async function makeBackup(action){
 if(!model.isDirector||busy)return;
 busy=true;$('euExcelBtn').disabled=$('euJsonBtn').disabled=true;
 euSetTopStatus('저장 중…','busy');
 try{const r=await jsonp({action,token});if(!r.ok)throw new Error(r.msg||'저장 실패');
  euSetTopStatus('저장됨','ok');
 }catch(e){euSetTopStatus('저장 오류','error');toast(e.message||'백업하지 못했습니다.');}
 finally{busy=false;$('euExcelBtn').disabled=$('euJsonBtn').disabled=false;}
}
async function changeCycle(id,cycle){const item=model.items.find(x=>x.itemId===id);if(!item||busy||!settingsMode)return;await runEdit({action:'editItem',token,itemId:id,cycle,text:item.text});}
async function runEdit(body){if(busy||!model.isDirector||!settingsMode)return false;busy=true;euSetTopStatus('저장 중…','busy');try{await post(body);busy=false;await load(model.viewUser);euSetTopStatus('저장됨','ok');return true;}catch(e){toast(e.message);euSetTopStatus('저장 오류','error');return false;}finally{busy=false;render();}}
addItem=async function(){const text=$('newText').value.trim();if(!text)return toast('내용을 입력하세요.');if(await runEdit({action:'addItem',token,role:$('newRole').value,cycle:$('newCycle').value,text})){$('modal').classList.remove('show');$('newText').value='';toast('항목을 추가했습니다.');}};
saveEdit=async function(){const text=$('editText').value.trim();if(!text)return toast('내용을 입력하세요.');if(await runEdit({action:'editItem',token,itemId:editingItemId,role:$("editRole").value,cycle:$('editCycle').value,text})){$('editModal').classList.remove('show');toast('수정했습니다.');}};
removeItem=async function(itemId){if(confirm('항목을 삭제할까요? 기존 완료 기록은 보존됩니다.'))await runEdit({action:'deleteItem',token,itemId});};
importBackup=async function(file){if(!model.isDirector||!file||busy)return;try{const backup=JSON.parse(await file.text());if(backup.type!=='everyup-checklist-backup'||!backup.sheets)throw new Error('복원용 체크리스트 JSON이 아닙니다.');if(!confirm('현재 데이터를 자동 백업한 후 이 파일로 항목과 기록을 복원할까요?'))return;busy=true;await post({action:'importBackup',token,backup});busy=false;await load(model.viewUser);toast('복원했습니다.');}catch(e){toast(e.message||'복원하지 못했습니다.');}finally{busy=false;$('importFile').value='';}};
$('saveBtn').onclick=()=>addItem();$('editSaveBtn').onclick=()=>saveEdit();
$('addBtn').onclick=()=>{if(!model.isDirector||!settingsMode||busy)return;const person=(model.staff||[]).find(x=>x.name===model.viewUser);if(person?.role)$('newRole').value=person.role;$('modal').classList.add('show');$('newText').focus();};
$('euSettingsActions').innerHTML='<button id="euChecklistSettings">설정</button><button id="euRestoreJson">JSON 복원</button>';
$('euChecklistSettings').onclick=()=>{$('euSettingsModal').classList.remove('show');toggleSettings();};
$('euRestoreJson').onclick=()=>{$('euSettingsModal').classList.remove('show');$('importFile').click();};
$('euGearBtn').onclick=()=>{if(model.isDirector)$('euSettingsModal').classList.add('show');};
document.querySelectorAll('[data-eu-close]').forEach(x=>x.onclick=()=>$('euSettingsModal').classList.remove('show'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay,.eu-u-settings').forEach(x=>x.classList.remove('show'));});
$('euMenuBtn').onclick=()=>location.href=LOGIN_URL;
$('euExcelBtn').onclick=saveNow;$('euJsonBtn').onclick=backupNow;
$('euTopToday').textContent='오늘 '+todayIso().slice(2);
const originalLoad=load;load=async function(target){euSetTopStatus('연결 중…','busy');try{await originalLoad(target);euSetTopStatus('연결됨','ok');}catch(e){euSetTopStatus('연결 오류','error');throw e;}};
syncControls();
if(!LIVE)euSetTopStatus('미리보기','offline');
// 계정별 마지막 직원·주기·화면, 1시간 범위의 인증 토큰 유지
const CL_AUTH_KEY='everyup_checklist_auth_v2';
function clGlobal(){try{return JSON.parse(localStorage.getItem('everyup_global_session_v1')||'null');}catch(e){return null;}}
function clSavedAuth(){try{const a=JSON.parse(sessionStorage.getItem(CL_AUTH_KEY)||'null'),g=clGlobal();if(!a||!a.token||!a.name||a.expiresAt<=Date.now())return null;if(g&&(g.name!==a.name||Number(g.expiresAt)<=Date.now()))return null;return a;}catch(e){return null;}}
readSession=function(){
 const g=clGlobal();
 if(g){if(!g.name||Number(g.expiresAt)<=Date.now())return null;try{if(g.pw64)return{name:g.name,part:g.part||'',pw:decodeURIComponent(escape(atob(g.pw64))),at:g.at,expiresAt:Number(g.expiresAt)};}catch(e){}}
 try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');const expiry=Number(s?.expiresAt)||Number(s?.at)+3600000;if(s?.name&&s.pw&&expiry>Date.now()&&(!g||g.name===s.name))return{...s,expiresAt:expiry};}catch(e){}
 const a=clSavedAuth();return a?{name:a.name,part:a.part,expiresAt:a.expiresAt}:null;
};
checklistTabKey=function(){return 'everyup_lasttab_체크리스트_'+(session?.name||'default');};
function clRememberView(){if(!session?.name||!model.viewUser)return;try{localStorage.setItem(checklistTabKey(),JSON.stringify({viewUser:model.viewUser,view:activeView,period:activePeriod,statsPeriod,statsAnchor}));}catch(e){}}
function clLastView(){try{return JSON.parse(localStorage.getItem(checklistTabKey())||'null')||{};}catch(e){return{};}}
function clLoginNotice(text){
 $('status').style.display='';$('status').replaceChildren(document.createTextNode(text+' '));
 const a=document.createElement('a');a.href=LOGIN_URL;a.textContent='로그인 메뉴로 이동';$('status').append(a);
 euSetTopStatus('로그인 확인 필요','error');
}
signOut=function(){try{sessionStorage.removeItem(CL_AUTH_KEY);}catch(e){}token='';clLoginNotice('로그인 유지 시간이 끝났거나 인증이 만료되었습니다.');};
const clRender=render;render=function(){clRender();clRememberView();};
start=async function(){
 if(!LIVE){$('status').textContent='미리보기 · 네트워크 차단. 운영 사이트에서 로그인하세요.';return;}
 session=readSession();if(!session){clLoginNotice('사용 가능한 로그인 정보가 없습니다. 처음 한 번 로그인해 주세요.');return;}
 const saved=clLastView();
 if(['daily','weekly','monthly','quarterly','all'].includes(saved.period))activePeriod=saved.period;
 if(['daily','weekly','monthly','quarterly','all'].includes(saved.statsPeriod))statsPeriod=saved.statsPeriod;
 if(/^\d{4}-\d{2}-\d{2}$/.test(saved.statsAnchor||''))statsAnchor=saved.statsAnchor;
 activeView=saved.view==='stats'?'stats':'checklist';
 try{
  const a=clSavedAuth();
  if(session.pw){const r=await jsonp({action:'auth',name:session.name,pw:session.pw});if(!r.ok)throw new Error(r.msg||'인증 실패');token=r.token;}
  else if(a)token=a.token;
  else throw new Error('로그인 정보가 만료되었습니다.');
  sessionStorage.setItem(CL_AUTH_KEY,JSON.stringify({token,name:session.name,part:session.part||'',expiresAt:session.expiresAt}));
  await load(saved.viewUser||'');if(activeView==='stats'&&model.canStats)await loadStats();
 }catch(e){clLoginNotice(e.message||'연결에 실패했습니다. 잠시 후 새로고침하세요.');}
};
window.addEventListener('pagehide',clRememberView);

// 화면 표시용 캐시: 서버 데이터/백업으로 사용하지 않습니다.
let clRestoring=false,clBooting=true,clFresh=false;
function clScreenKey(){return 'everyup_checklist_screen_v1_'+session.name;}
function clSaveScreen(){
 if(clRestoring||clBooting||!session?.name||!model?.viewUser)return;
 try{sessionStorage.setItem(clScreenKey(),JSON.stringify({name:session.name,expiresAt:session.expiresAt,model,activeView,activePeriod,statsPeriod,statsAnchor,statsData,settingsMode,scrollY:window.scrollY}));}catch(e){}
}
function clReadScreen(user){
 try{const s=JSON.parse(sessionStorage.getItem('everyup_checklist_screen_v1_'+user.name)||'null');
 if(!s||s.name!==user.name||s.expiresAt<=Date.now()||!s.model||!Array.isArray(s.model.items)||!s.model.viewUser)return null;return s;
 }catch(e){return null;}
}
const screenRender=render;render=function(){screenRender();clSaveScreen();};
const screenStats=renderStatsContent;renderStatsContent=function(){screenStats();clSaveScreen();};
window.addEventListener('pagehide',clSaveScreen);
const screenLoad=load;load=async function(target){await screenLoad(target);clFresh=true;};
function clScreenLock(locked){
 document.querySelector('main').inert=locked;
 $('euUnifiedHeader').inert=locked;
 document.querySelectorAll('.overlay,.eu-u-settings').forEach(e=>e.inert=locked);
}
const screenStart=start;
start=async function(){
 if(!LIVE){clBooting=false;return screenStart();}
 const user=readSession(),cached=user?clReadScreen(user):null;
 if(cached){
  session=user;model=cached.model;activeView=cached.activeView==='stats'?'stats':'checklist';
  activePeriod=cached.activePeriod;statsPeriod=cached.statsPeriod;statsAnchor=cached.statsAnchor;statsData=cached.statsData;
  settingsMode=!!cached.settingsMode&&!!model.isDirector;
  clRestoring=true;
  try{render();if(activeView==='stats'&&statsData)renderStatsContent();}finally{clRestoring=false;}
  clScreenLock(true);$('clRefreshOverlay').hidden=false;euSetTopStatus('불러오는 중…','busy');
  requestAnimationFrame(()=>window.scrollTo(0,Number(cached.scrollY)||0));
 }
 try{await screenStart();}finally{
  clBooting=false;
  if(clFresh){$('clRefreshOverlay').hidden=true;clScreenLock(false);clSaveScreen();}
  else if(cached){$('clRefreshMessage').textContent='최신 정보를 불러오지 못했습니다. 다시 시도해 주세요.';$('clRefreshRetry').hidden=false;$('clRefreshMenu').hidden=false;}
 }
};
$('clRefreshRetry').onclick=()=>location.reload();
$('clRefreshMenu').href=LOGIN_URL;

start();

</script></body></html>
