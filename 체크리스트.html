<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에브리업 셀프 체크리스트</title>
<style>
:root{--green:#33625d;--green2:#284f4b;--mint:#e8f0ee;--bg:#f4f2ed;--surface:#fff;--line:#ddd9d0;--text:#252a2e;--sub:#70777d;--red:#b74c4c;--shadow:0 8px 28px rgba(40,50,48,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(244,242,237,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:auto;padding:11px 18px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--text);font-size:18px;white-space:nowrap}.brand img{height:34px;width:auto;display:block}.brand-title{padding-left:12px;border-left:1px solid var(--line)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding:24px 18px 60px}.toolbar{display:flex;gap:8px;align-items:center;margin-left:auto}.hero{display:flex;gap:16px;align-items:flex-end;margin-bottom:18px}.hero h1{margin:0;font-size:25px}.hero p{margin:5px 0 0;color:var(--sub);font-size:13px}.hero .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.dashboard{display:grid;grid-template-columns:240px 1fr;gap:14px;margin:16px 0 22px}.periodnav{display:grid;gap:8px}.periodbtn{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;color:var(--text)}.periodbtn>strong{font-size:14px}.periodbtn span{text-align:right}.periodbtn b{display:block;font-size:13px;color:var(--green)}.periodbtn small{display:block;font-size:10px;color:var(--sub);margin-top:2px}.periodbtn.active{background:var(--green);border-color:var(--green);color:#fff}.periodbtn.active b,.periodbtn.active small{color:#fff}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:27px;color:var(--green)}.stat span{display:block;color:var(--sub);font-size:11px;margin-top:4px}
.group{margin:18px 0}.grouphead{display:flex;align-items:center;margin-bottom:8px}.grouphead h2{font-size:16px;margin:0}.grouphead span{margin-left:8px;font-size:11px;color:var(--sub)}
.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;box-shadow:0 1px 0 rgba(0,0,0,.02)}.item.done{background:#f2f7f5;border-color:#b9d0ca}.check{width:22px;height:22px;margin-top:1px;accent-color:var(--green);cursor:pointer}.itemtext{font-size:14px;line-height:1.5}.meta{font-size:11px;color:var(--sub);margin-top:5px}.itemactions{display:flex;gap:5px}.edit,.del{border:0;background:transparent;font-size:11px;cursor:pointer;padding:4px}.edit{color:var(--green)}.del{color:var(--red)}.empty,.loading,.setup{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--sub)}
.setup{border-color:#e4c477;background:#fffaf0;color:#6d5720}.setup code{display:block;margin:10px auto 0;max-width:620px;white-space:normal;font-size:11px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:100%;max-width:520px;background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.modal h3{margin:0 0 16px}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#26312f;color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60}.toast.show{opacity:1}
@media(max-width:800px){.topin{flex-wrap:wrap}.toolbar{order:3;width:100%;margin:0;display:grid;grid-template-columns:repeat(3,1fr)}.toolbar .btn{padding:9px 6px}.brand img{height:28px}.brand-title{font-size:15px}.hero{align-items:stretch;flex-direction:column}.hero .actions{margin-left:0}.hero .actions select{flex:1;min-width:0}.dashboard{grid-template-columns:150px 1fr}.summary{grid-template-columns:1fr}.item{grid-template-columns:28px 1fr}.itemactions{grid-column:2;justify-self:end}.topin{padding:10px 12px}main{padding:18px 12px 50px}.stat{padding:12px}.stat b{font-size:20px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><img src="https://sikkakk.github.io/everyup/logo.png" alt="에브리업의원"><span class="brand-title">직원 셀프 체크리스트</span></div><button class="btn" id="backBtn">← 메뉴</button><div class="toolbar"><button class="btn" id="saveNowBtn">↻ 지금 저장</button><button class="btn" id="backupBtn">백업</button><button class="btn" id="importBtn">가져오기</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></div></header>
<main>
  <section class="hero"><div><h1 id="pageTitle">셀프 체크리스트</h1><p id="pageSub">내 업무를 확인하고 완료한 항목을 체크하세요.</p></div><div class="actions" id="adminActions" hidden><select id="staffSelect"></select><button class="btn primary" id="addBtn">+ 항목 추가</button></div></section>
  <section class="dashboard" id="dashboard" hidden><nav class="periodnav" id="periodNav"></nav><div class="summary"><div class="stat"><b id="doneCount">0 / 0</b><span>완료 개수</span></div><div class="stat"><b id="rate">0%</b><span>완료율</span></div></div></section>
  <div class="loading" id="status">체크리스트를 불러오는 중입니다…</div>
  <div id="groups"></div>
</main>
<div class="overlay" id="modal"><div class="modal"><h3>체크리스트 항목 추가</h3><div class="field"><label>직무</label><select id="newRole"><option>코디네이터</option><option>총괄상담실장</option><option>간호조무사</option><option>피부관리사</option><option>원장</option></select></div><div class="field"><label>주기</label><select id="newCycle"><option>매일</option><option>오전</option><option>관리중</option><option>오후</option><option>매주</option><option>매월</option><option>분기</option><option>필요시</option></select></div><div class="field"><label>체크 항목</label><input id="newText" maxlength="300" placeholder="확인할 업무를 입력하세요"></div><div class="modalactions"><button class="btn" id="cancelBtn">취소</button><button class="btn primary" id="saveBtn">추가</button></div></div></div>
<div class="overlay" id="editModal"><div class="modal"><h3>체크리스트 항목 수정</h3><div class="field"><label>주기</label><select id="editCycle"><option>매일</option><option>오전</option><option>관리중</option><option>오후</option><option>매주</option><option>매월</option><option>분기</option><option>필요시</option></select></div><div class="field"><label>체크 항목</label><input id="editText" maxlength="300"></div><div class="modalactions"><button class="btn" id="editCancelBtn">취소</button><button class="btn primary" id="editSaveBtn">수정 저장</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
// 새 Apps Script 웹앱을 배포한 뒤 이 주소만 교체합니다.
const CHECKLIST_API = "https://script.google.com/macros/s/AKfycbwvRyZmi2VQfqgrceymF6BmkFSDicVYOno3oxtX9_t5X-RxRNhHOh8V8HxJGIHKf6HT/exec";
const LOGIN_URL = "https://sikkakk.github.io/everyup/%EB%A1%9C%EA%B7%B8%EC%9D%B8.html";
const SESSION_KEY = "everyup_checklist_user";
let session=null, token="", model={items:[],records:{},isAdmin:false,isDirector:false,staff:[],viewUser:""}, busy=false, activePeriod="daily", editingItemId="";
const $=id=>document.getElementById(id);

function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}
function jsonp(params){return new Promise((resolve,reject)=>{const cb="cl_"+Math.random().toString(36).slice(2);const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"))},15000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error("network"))};s.src=CHECKLIST_API+"?callback="+cb+"&"+Object.entries(params).map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v??"")).join("&");document.body.appendChild(s)})}
async function post(body){await fetch(CHECKLIST_API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})}
function readSession(){try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");if(!s||!s.name||!s.pw||Date.now()-s.at>8*60*60*1000)return null;return s}catch(e){return null}}
function signOut(){try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}location.replace(LOGIN_URL)}
async function start(){session=readSession();if(!session){signOut();return}if(CHECKLIST_API.includes("__CHECKLIST")){showSetup();return}try{const r=await jsonp({action:"auth",name:session.name,pw:session.pw});if(!r.ok)throw new Error(r.msg||"인증 실패");token=r.token;sessionStorage.setItem(SESSION_KEY,JSON.stringify({name:session.name,part:session.part,at:session.at}));await load()}catch(e){$("status").textContent="로그인 확인에 실패했습니다. 메뉴로 돌아가 다시 로그인해주세요."}}
function showSetup(){$("status").className="setup";$("status").innerHTML="체크리스트 백엔드 연결 전입니다.<code>체크리스트_백엔드.gs를 Apps Script로 배포한 뒤 웹앱 주소를 연결하세요.</code>"}
async function load(target){const r=await jsonp({action:"load",token,targetUser:target||model.viewUser||""});if(!r.ok){if(r.code==="AUTH")signOut();throw new Error(r.msg||"불러오기 실패")}model=r;render()}
function periodItems(items,key){if(key==="all")return items;if(key==="weekly")return items.filter(x=>x.cycle==="매주");if(key==="monthly")return items.filter(x=>x.cycle==="매월");if(key==="quarterly")return items.filter(x=>x.cycle==="분기");return items.filter(x=>["매일","오전","관리중","오후","필요시"].includes(x.cycle))}
function periodStat(items,records){const done=items.filter(x=>records[x.itemId]?.checked).length;return{done,total:items.length,rate:items.length?Math.round(done/items.length*100):0}}
function renderPeriodNav(items,records){const defs=[["daily","매일"],["weekly","매주"],["monthly","매월"],["quarterly","분기"],["all","전체"]];$("periodNav").innerHTML=defs.map(([key,label])=>{const s=periodStat(periodItems(items,key),records);return`<button class="periodbtn ${activePeriod===key?"active":""}" data-period="${key}"><strong>${label}</strong><span><b>${s.done} / ${s.total}</b><small>${s.rate}% 완료</small></span></button>`}).join("");document.querySelectorAll(".periodbtn").forEach(btn=>btn.onclick=()=>{activePeriod=btn.dataset.period;render()})}
function render(){const isOwn=!model.isAdmin||model.viewUser===session.name;$("status").style.display="none";$("dashboard").hidden=false;$("adminActions").hidden=!model.isAdmin;$("backupBtn").hidden=!model.isAdmin;$("importBtn").hidden=!model.isAdmin;$("pageTitle").textContent=model.viewUser+" "+model.viewRole;$("pageSub").textContent=isOwn?"완료한 항목을 체크하면 날짜·시간과 이름이 기록됩니다.":"조회 중입니다. 직원 본인만 체크 상태를 수정할 수 있습니다.";if(model.isAdmin){const sel=$("staffSelect");sel.innerHTML=model.staff.map(x=>`<option value="${esc(x.name)}" ${x.name===model.viewUser?"selected":""}>${esc(x.name)} · ${esc(x.part)}</option>`).join("")}const allItems=model.items||[],records=model.records||{};renderPeriodNav(allItems,records);const items=periodItems(allItems,activePeriod),stat=periodStat(items,records);$("doneCount").textContent=stat.done+" / "+stat.total;$("rate").textContent=stat.rate+"%";const order=["매일","오전","관리중","오후","매주","매월","분기","필요시"];const grouped={};items.forEach(x=>(grouped[x.cycle]??=[]).push(x));$("groups").innerHTML=order.filter(c=>grouped[c]?.length).map(c=>`<section class="group"><div class="grouphead"><h2>${cycleTitle(c)}</h2><span>${grouped[c].length}개</span></div><div class="list">${grouped[c].map(x=>itemHtml(x,records[x.itemId],isOwn)).join("")}</div></section>`).join("")||'<div class="empty">등록된 체크리스트가 없습니다.</div>';document.querySelectorAll(".check").forEach(el=>el.addEventListener("change",()=>toggle(el.dataset.id,el.checked)));document.querySelectorAll(".del").forEach(el=>el.addEventListener("click",()=>removeItem(el.dataset.id)));document.querySelectorAll(".edit").forEach(el=>el.addEventListener("click",()=>openEdit(el.dataset.id)))}
function cycleTitle(c){return({"매일":"📅 매일","오전":"🌅 오전","관리중":"🧴 관리 중","오후":"🌆 오후 마감","매주":"📋 매주","매월":"📊 매월","분기":"🔍 분기","필요시":"🔧 필요 시"})[c]||c}
function itemHtml(x,r,isOwn){const done=!!r?.checked;const meta=done?`${formatDate(r.actionAt)} · ${esc(r.actionBy)}`:"아직 완료하지 않았습니다.";const actions=(model.isDirector?`<button class="edit" data-id="${x.itemId}">수정</button>`:"")+(model.isAdmin?`<button class="del" data-id="${x.itemId}">삭제</button>`:"");return `<article class="item ${done?"done":""}"><input class="check" type="checkbox" data-id="${x.itemId}" ${done?"checked":""} ${!isOwn||busy?"disabled":""}><div><div class="itemtext">${esc(x.text)}</div><div class="meta">${meta}</div></div>${actions?`<div class="itemactions">${actions}</div>`:""}</article>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[m])}
function formatDate(v){if(!v)return"";const d=new Date(v);return d.toLocaleString("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
async function toggle(itemId,checked){if(busy)return;busy=true;try{await post({action:"toggle",token,itemId,checked});toast("저장했습니다.");await new Promise(r=>setTimeout(r,600));await load(model.viewUser)}catch(e){toast("저장하지 못했습니다.");await load(model.viewUser)}finally{busy=false}}
async function removeItem(itemId){if(!confirm("이 항목을 삭제할까요? 기존 완료 기록은 보존됩니다."))return;await post({action:"deleteItem",token,itemId});toast("삭제했습니다.");await new Promise(r=>setTimeout(r,600));await load(model.viewUser)}
async function addItem(){const role=$("newRole").value,cycle=$("newCycle").value,text=$("newText").value.trim();if(!text){toast("체크 항목을 입력해주세요.");return}await post({action:"addItem",token,role,cycle,text});$("modal").classList.remove("show");$("newText").value="";toast("항목을 추가했습니다.");await new Promise(r=>setTimeout(r,600));await load(model.viewUser)}
function openEdit(itemId){if(!model.isDirector)return;const item=model.items.find(x=>x.itemId===itemId);if(!item)return;editingItemId=itemId;$("editCycle").value=item.cycle;$("editText").value=item.text;$("editModal").classList.add("show")}
async function saveEdit(){const text=$("editText").value.trim();if(!text){toast("체크 항목을 입력해주세요.");return}await post({action:"editItem",token,itemId:editingItemId,cycle:$("editCycle").value,text});$("editModal").classList.remove("show");toast("수정했습니다.");await new Promise(r=>setTimeout(r,600));await load(model.viewUser)}
async function saveNow(){try{await load(model.viewUser);toast("현재 내용이 저장되어 있습니다.")}catch(e){toast("저장 상태를 확인하지 못했습니다.")}}
async function backupNow(){if(!model.isAdmin)return;try{const r=await jsonp({action:"backup",token});if(!r.ok)throw new Error(r.msg||"백업 실패");toast("체크리스트 백업 폴더에 저장했습니다.")}catch(e){toast("백업하지 못했습니다.")}}
async function importBackup(file){if(!model.isAdmin||!file)return;try{const text=await file.text();const data=JSON.parse(text);if(!confirm("이 백업을 가져오면 현재 체크리스트 데이터가 교체됩니다. 계속할까요?"))return;await post({action:"importBackup",token,backup:data});toast("가져오기를 요청했습니다.");await new Promise(r=>setTimeout(r,1200));await load(model.viewUser)}catch(e){toast("올바른 체크리스트 JSON 파일인지 확인해주세요.")}finally{$("importFile").value=""}}
$("staffSelect").addEventListener("change",e=>{model.viewUser=e.target.value;activePeriod="daily";load(model.viewUser).catch(()=>toast("불러오지 못했습니다."))});$("addBtn").onclick=()=>$("modal").classList.add("show");$("cancelBtn").onclick=()=>$("modal").classList.remove("show");$("saveBtn").onclick=addItem;$("editCancelBtn").onclick=()=>$("editModal").classList.remove("show");$("editSaveBtn").onclick=saveEdit;$("saveNowBtn").onclick=saveNow;$("backupBtn").onclick=backupNow;$("importBtn").onclick=()=>$("importFile").click();$("importFile").addEventListener("change",e=>importBackup(e.target.files[0]));$("backBtn").onclick=()=>location.href=LOGIN_URL;start();
</script>
</body>
</html>
