<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에브리업의원 · 예약 통계</title>
<style>
  :root{
    --navy:#1C2B4A; --navy2:#2C3E50;
    --teal:#0EA5A0; --teal-lt:#E6F7F6;
    --blue:#2E86C1; --blue-lt:#EAF2FB;
    --purple:#7D3C98; --purple-lt:#F4ECF7;
    --green:#1E8E54; --green-lt:#EAFAF1;
    --amber:#D97706; --amber-lt:#FEF3E2;
    --red:#D64541; --red-lt:#FDECEA;
    --ink:#1C2B4A; --muted:#7C8A99; --line:#E4E9EE; --bg:#F1F4F8; --card:#FFFFFF;
    --r:14px; --shadow:0 1px 3px rgba(28,43,74,.06),0 8px 24px rgba(28,43,74,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.5;}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

  /* ---- header ---- */
  header{background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px;
    flex-wrap:wrap; position:sticky; top:0; z-index:30;}
  .brand{font-weight:800; font-size:17px; letter-spacing:-.2px; display:flex; align-items:center; gap:9px}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 4px rgba(14,165,160,.25)}
  .tab-bar{display:flex; gap:4px; background:rgba(255,255,255,.08); padding:4px; border-radius:11px}
  .tab{border:0; background:transparent; color:#cdd6e4; font-weight:700; font-size:14px; padding:8px 18px; border-radius:8px; transition:.15s;}
  .tab.active{background:#fff; color:var(--navy)}
  .spacer{flex:1}
  .topbtn{border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#e7ecf3;
    font-weight:600; font-size:12.5px; padding:8px 13px; border-radius:9px; transition:.15s;}
  .topbtn:hover{background:rgba(255,255,255,.16)}
  .save-indicator{font-size:12px; color:#9fb0c4; display:flex; align-items:center; gap:6px; font-weight:600; opacity:1; transition:.2s; white-space:nowrap}
  .save-indicator.show{opacity:1}

  /* ---- layout ---- */
  main{max-width:1080px; margin:0 auto; padding:22px 20px 60px}
  .panel{display:none}
  .panel.active{display:block}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:18px; margin-bottom:16px;}
  .card-title{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.04em; margin-bottom:14px;}
  .week-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .week-row input[type=date]{padding:9px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; color:var(--ink); font-family:inherit;}
  .week-lbl{font-size:15px; font-weight:800; color:var(--teal);}
  .wk-nav{border:1px solid var(--line); background:#fff; color:var(--navy2); font-weight:700; font-size:13px; padding:9px 14px; border-radius:9px; cursor:pointer; transition:.12s; white-space:nowrap;}
  .wk-nav:hover{background:#f1f4f7;}
  .wk-nav.today{background:var(--teal); color:#fff; border-color:var(--teal);}
  .wk-nav.today:hover{background:#0c918d;}

  /* ---- day tabs ---- */
  .day-tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .dtab{padding:8px 15px; font-size:13px; font-weight:700; border:1px solid var(--line); border-radius:9px; background:#fff; color:#5a6b7d; cursor:pointer; white-space:nowrap; transition:.12s;}
  .dtab:hover{background:#f5f8fb}
  .dtab.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .dtab.has-data{border-color:#9fd8d4; color:var(--teal);}
  .dtab.has-data.active{background:var(--teal); color:#fff; border-color:var(--teal);}

  /* ---- input table ---- */
  table.dt{width:100%; border-collapse:collapse; overflow:hidden; border-radius:10px;}
  table.dt th{background:var(--navy); color:#fff; font-size:12px; font-weight:700; padding:11px 10px; text-align:center;}
  table.dt th:first-child{text-align:left; min-width:80px;}
  table.dt td{padding:9px 8px; border-bottom:1px solid #EEF1F5; text-align:center; font-size:13.5px; color:var(--ink);}
  table.dt td:first-child{text-align:left; font-weight:700; color:var(--navy2); background:#F8FAFC;}
  table.dt tfoot td{background:var(--teal-lt); font-weight:800; color:var(--teal); border-top:2px solid #bfe9e6;}
  table.dt tfoot td:first-child{color:var(--teal); background:var(--teal-lt);}
  table.dt input[type=number]{width:62px; padding:7px 4px; border:1px solid var(--line); border-radius:7px; font-size:14px; text-align:center; background:#fff; color:var(--ink); font-family:inherit;}
  table.dt input[type=number]:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,165,160,.15);}

  /* ---- metric cards ---- */
  .metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:16px 0;}
  .mc{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:16px 18px;}
  .mc-label{font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px;}
  .mc-val{font-size:28px; font-weight:800; color:var(--teal); letter-spacing:-1px; line-height:1.1;}
  .mc-sub{font-size:11px; color:var(--muted); margin-top:5px;}

  .week-sum-btn{width:100%; padding:12px; font-size:14px; font-weight:800; background:var(--teal); color:#fff; border:0; border-radius:10px; cursor:pointer; transition:.15s;}
  .week-sum-btn:hover{background:#0c918d;}

  /* ---- history table ---- */
  table.ht{width:100%; border-collapse:collapse;}
  table.ht th{background:var(--navy); color:#fff; font-size:12px; font-weight:700; padding:10px 10px; text-align:center;}
  table.ht th:first-child{text-align:left;}
  table.ht td{padding:9px 10px; border-bottom:1px solid #EEF1F5; text-align:center; font-size:12.5px; color:var(--ink);}
  table.ht td:first-child{text-align:left; color:#5a6b7d;}
  table.ht tr.week-total td{background:var(--teal-lt); font-weight:800; color:var(--teal);}

  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--green-lt); color:var(--green);}
  .del-btn{padding:4px 10px; font-size:11px; border:1px solid #f3c9c5; border-radius:7px; background:#fff; color:var(--red); cursor:pointer; font-weight:600;}
  .del-btn:hover{background:var(--red-lt);}
  .empty{text-align:center; color:var(--muted); padding:34px; font-size:13.5px;}

  /* ---- chart toggles ---- */
  .ctoggle{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .ctab{padding:7px 15px; font-size:12.5px; font-weight:700; border:1px solid var(--line); border-radius:999px; background:#fff; color:#5a6b7d; cursor:pointer; transition:.12s;}
  .ctab.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .trend-toggle{margin-left:auto; border-color:#bcbfd6;}
  .trend-toggle.active{background:var(--purple); border-color:var(--purple);}
  .chart-wrap{position:relative; width:100%; height:300px;}
  .chart-wrap2{position:relative; width:100%; height:260px;}
  .view-toggle{display:flex; gap:6px; margin-bottom:12px;}
  .vt{padding:7px 15px; font-size:12.5px; font-weight:700; border:1px solid var(--line); border-radius:8px; background:#fff; color:#5a6b7d; cursor:pointer;}
  .vt.active{background:var(--teal-lt); color:var(--teal); border-color:#9fd8d4;}

  @media (max-width:640px){
    .metrics{grid-template-columns:1fr}
    .brand{font-size:15px}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>에브리업의원 · 예약 통계</div>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('input')">데이터 입력</button>
    <button class="tab" onclick="showTab('history')">기록 조회</button>
    <button class="tab" onclick="showTab('chart')">추세 그래프</button>
  </div>
  <div class="spacer"></div>
  <span class="save-indicator" id="saveIndicator">● 구글 시트</span>
  <button class="topbtn" onclick="refreshCloud()" title="구글 시트에서 최신 데이터 불러오기">↻ 새로고침</button>
  <button class="topbtn" onclick="exportData()">백업 내보내기</button>
  <button class="topbtn" onclick="document.getElementById('importFile').click()">가져오기</button>
  <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(this.files[0])">
</header>

<main>
  <div id="tab-input" class="panel active">
    <div class="card">
      <div class="card-title">주차 선택</div>
      <div class="week-row">
        <button class="wk-nav" onclick="shiftWeek(-1)">◀ 이전주</button>
        <input type="date" id="weekStart">
        <button class="wk-nav" onclick="shiftWeek(1)">다음주 ▶</button>
        <button class="wk-nav today" onclick="thisWeek()">이번 주</button>
        <span class="week-lbl" id="weekLbl">—</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">요일 선택</div>
      <div class="day-tabs" id="dayTabs"></div>
      <table class="dt">
        <thead><tr><th>채널</th><th>예약문의</th><th>예약성공</th><th>보류</th><th>무응답</th></tr></thead>
        <tbody id="inputBody"></tbody>
        <tfoot><tr><td>합계</td><td id="t-inq">0</td><td id="t-bk">0</td><td id="t-hold">0</td><td id="t-nr">0</td></tr></tfoot>
      </table>
    </div>
    <div class="metrics">
      <div class="mc"><div class="mc-label">전환율 (문의→예약)</div><div class="mc-val" id="m-conv">—</div><div class="mc-sub">예약성공 ÷ 예약문의</div></div>
      <div class="mc"><div class="mc-label">보류율</div><div class="mc-val" id="m-hold">—</div><div class="mc-sub">보류 ÷ 예약문의</div></div>
      <div class="mc"><div class="mc-label">무응답율</div><div class="mc-val" id="m-nr">—</div><div class="mc-sub">무응답 ÷ 예약문의</div></div>
    </div>
    <div class="card">
      <div class="card-title">📊 주간 합계 (월~일)</div>
      <div id="weekSummaryWrap"></div>
    </div>
  </div>

  <div id="tab-history" class="panel">
    <div class="card">
      <div class="card-title">조회 단위</div>
      <div class="view-toggle">
        <button class="vt active" onclick="setView('day')">일별</button>
        <button class="vt" onclick="setView('week')">주별</button>
      </div>
      <div id="historyWrap"></div>
    </div>
  </div>

  <div id="tab-chart" class="panel">
    <div class="card">
      <div class="card-title">지표 선택</div>
      <div class="ctoggle" id="ctoggle">
        <button class="ctab active" onclick="switchChart('overview')">전체 추세</button>
        <button class="ctab" onclick="switchChart('channel')">채널별 비교</button>
        <button class="ctab" onclick="switchChart('rate')">전환·보류율</button>
        <button class="ctab trend-toggle active" id="trendToggle" onclick="toggleTrend()">📈 추세선</button>
      </div>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">채널별 누적 예약문의</div>
      <div class="chart-wrap2"><canvas id="chChart"></canvas></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const CH = ['전화','네이버','카카오','여신티켓','강남언니','AI'];
const COLORS = ['#0EA5A0','#2E86C1','#7D3C98','#D97706','#DB2777','#1E8E54'];
const MK = ['inq','bk','hold','nr'];
const DAY_NAMES = ['월','화','수','목','금','토','일'];

let store = {};
let chartM = null, chartC = null, curMode = 'overview';
let showTrend = true;
let curWeek = '', curDayIdx = 0;
let histView = 'day';
let saveTimer = null;

/* ===== 구글 시트 연동 (상담결제전환관리와 같은 URL 사용) ===== */
/*  ▼▼▼ 상담결제전환관리에서 쓰던 그 Apps Script /exec URL을 그대로 붙여넣으세요 ▼▼▼ */
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbzP4SKXTS47Xkqx7RlQ08MQNmukNOsNh8IF8Kl9BhKCuQN87zq9Jt7WRn9XMaYBZDUS/exec";
/*  ▲▲▲ 비워두면 예전처럼 이 브라우저에만 저장됩니다 ▲▲▲ */
const cloudOn = !!CLOUD_URL;
let syncedOK = false;   // 시트에서 정상 로드(또는 명시적 가져오기) 되었는가

function cloudPush(){
  if(!cloudOn) return;
  if(!syncedOK){
    const ind=document.getElementById('saveIndicator');
    ind.textContent='⚠ 시트 미동기화 · 로컬만 저장'; ind.style.color='#ffb84d'; ind.classList.add('show');
    return;   // 시트를 아직 못 불러온 상태 → 시트 저장 보류(덮어쓰기 방지)
  }
  if(!store || Object.keys(store).length===0){
    const ind=document.getElementById('saveIndicator');
    ind.textContent='⚠ 빈 데이터 · 시트 저장 안 함'; ind.style.color='#ffb84d'; ind.classList.add('show');
    return;   // 빈 데이터로 시트를 덮어쓰지 않음
  }
  fetch(CLOUD_URL, {method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'saveResv', store:store})
  }).catch(function(){});
}
function cloudPull(){
  return new Promise(function(resolve){
    if(!cloudOn){ resolve(false); return; }
    var cb='__rv_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e4);
    var s=document.createElement('script'); var done=false;
    function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(res){ done=true; try{
      if(res && res.ok && res.resv && typeof res.resv==='object'){
        store=res.resv;
        try{ localStorage.setItem('ct_daily_v1', JSON.stringify(store)); }catch(e){}
        syncedOK=true; resolve(true);
      } else resolve(false);
    } finally { cleanup(); } };
    s.onerror=function(){ if(!done){ resolve(false); cleanup(); } };
    s.src=CLOUD_URL+(CLOUD_URL.indexOf('?')>=0?'&':'?')+'callback='+cb+'&t='+Date.now();
    document.head.appendChild(s);
    setTimeout(function(){ if(!done){ resolve(false); cleanup(); } }, 15000);
  });
}
function refreshCloud(){
  if(!cloudOn){ alert('구글 시트 연동이 설정되지 않았습니다. (CLOUD_URL 비어 있음)'); return; }
  const ind=document.getElementById('saveIndicator');
  ind.textContent='↻ 동기화 중…'; ind.style.color='#8fd3ff'; ind.classList.add('show');
  cloudPull().then(function(ok){
    if(ok){
      buildDayTabs(); loadDay();
      if(document.getElementById('tab-history').classList.contains('active')) renderHistory();
      ind.textContent='✓ 최신 데이터 불러옴'; ind.style.color='#7fe3dd';
      setTimeout(()=>ind.classList.remove('show'),1800);
    } else { ind.textContent='⚠ 동기화 실패'; ind.style.color='#dc2626'; }
  });
}

try { const s = localStorage.getItem('ct_daily_v1'); if(s) store = JSON.parse(s); } catch(e){}

function persist(){
  const ind = document.getElementById('saveIndicator');
  clearTimeout(saveTimer);
  try {
    localStorage.setItem('ct_daily_v1', JSON.stringify(store));
    ind.textContent = cloudOn ? '● 구글 시트에 저장됨' : '● 저장됨(이 PC)';
    ind.style.color = '#7fe3dd';
    ind.classList.add('show');
    saveTimer = setTimeout(() => ind.classList.remove('show'), 1500);
    if(cloudOn) cloudPush();
  } catch(e) {
    ind.textContent = '⚠ 저장 실패! 화면을 새로고침하지 마세요';
    ind.style.color = '#dc2626';
    ind.classList.add('show');
    console.error('localStorage 저장 실패:', e);
  }
}

// 날짜 문자열(YYYY-MM-DD)을 로컬 Date로 변환
function parseLocal(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

// 해당 날짜가 속한 주의 월요일 반환 (YYYY-MM-DD)
function getMonday(str){
  const d = parseLocal(str);
  const dow = d.getDay(); // 0=일, 1=월 ... 6=토
  // 월요일로 맞추기: 일요일(0)이면 -6, 월요일(1)이면 0, ..., 토요일(6)이면 -5
  const offset = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + offset);
  return toYMD(d);
}

function toYMD(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 주의 월요일(str)에서 i일 후 날짜 반환
function weekDay(monStr, i){
  const d = parseLocal(monStr);
  d.setDate(d.getDate() + i);
  return toYMD(d);
}

// 날짜 문자열 → 요일 인덱스 (월=0, 화=1 ... 일=6)
function dayIndex(str){
  const dow = parseLocal(str).getDay(); // 0=일
  return dow === 0 ? 6 : dow - 1;
}

function fmtShort(str){
  const d = parseLocal(str);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function fmtWeek(monStr){
  const d = parseLocal(monStr);
  const e = parseLocal(monStr); e.setDate(e.getDate()+6);
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 주`;
}

function buildTable(){
  const tb = document.getElementById('inputBody');
  tb.innerHTML = '';
  CH.forEach(ch => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${ch}</td>` + MK.map(m =>
      `<td><input type="number" min="0" value="0" id="i_${ch}_${m}" oninput="onInput()"></td>`
    ).join('');
    tb.appendChild(tr);
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = toYMD(new Date());
  a.href = url;
  a.download = `에브리업_예약통계_백업_${today}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const imported = JSON.parse(e.target.result);
      if(typeof imported !== 'object' || imported === null) throw new Error('invalid');
      const existingCount = Object.keys(store).length;
      const importCount = Object.keys(imported).length;
      if(existingCount > 0){
        if(!confirm(`현재 앱에 ${existingCount}일치 데이터가 있습니다.\n백업 파일에는 ${importCount}일치 데이터가 있습니다.\n\n가져오면 겹치는 날짜는 백업 파일 내용으로 덮어씌워집니다. 계속할까요?`)) return;
      }
      syncedOK=true;   // 사용자가 명시적으로 가져온 데이터 → 시트 저장 허용
      store = Object.assign({}, store, imported);
      persist();
      buildDayTabs();
      loadDay();
      if(document.getElementById('tab-history').classList.contains('active')) renderHistory();
      alert(`가져오기 완료: ${importCount}일치 데이터를 불러왔습니다.`);
    } catch(err){
      alert('파일을 읽는 데 실패했습니다. 올바른 백업 JSON 파일인지 확인해주세요.');
      console.error(err);
    }
    document.getElementById('importFile').value = '';
  };
  reader.readAsText(file);
}

function onInput(){ calcTotals(); autoSave(); }

function autoSave(){
  if(!curWeek) return;
  const dateStr = weekDay(curWeek, curDayIdx);
  const wd = {};
  CH.forEach(ch => { wd[ch] = {}; MK.forEach(m => { wd[ch][m] = +document.getElementById(`i_${ch}_${m}`).value || 0; }); });
  store[dateStr] = wd;
  persist();
  buildDayTabs();
  showWeekSummary();
}

function buildDayTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  // i=0 → 월요일, i=1 → 화요일 ... i=6 → 일요일
  for(let i = 0; i < 7; i++){
    const dateStr = weekDay(curWeek, i);  // curWeek은 항상 월요일
    const hasData = store[dateStr] && CH.some(ch => MK.some(m => (store[dateStr][ch]?.[m] || 0) > 0));
    const btn = document.createElement('button');
    btn.className = 'dtab' + (i === curDayIdx ? ' active' : '') + (hasData ? ' has-data' : '');
    // DAY_NAMES[i]: i=0→월, i=4→금, i=6→일
    btn.textContent = `${DAY_NAMES[i]} (${fmtShort(dateStr)})`;
    btn.onclick = (()=>{ const idx=i; return ()=>{ curDayIdx=idx; loadDay(); buildDayTabs(); }; })();
    wrap.appendChild(btn);
  }
}

function loadDay(){
  const dateStr = weekDay(curWeek, curDayIdx);
  const wd = store[dateStr];
  CH.forEach(ch => MK.forEach(m => {
    const el = document.getElementById(`i_${ch}_${m}`);
    if(el) el.value = wd ? (wd[ch]?.[m] || 0) : 0;
  }));
  calcTotals();
  showWeekSummary();
}

function calcTotals(){
  let inq=0,bk=0,hold=0,nr=0;
  CH.forEach(ch => {
    inq  += +document.getElementById(`i_${ch}_inq`).value  || 0;
    bk   += +document.getElementById(`i_${ch}_bk`).value   || 0;
    hold += +document.getElementById(`i_${ch}_hold`).value  || 0;
    nr   += +document.getElementById(`i_${ch}_nr`).value    || 0;
  });
  document.getElementById('t-inq').textContent  = inq;
  document.getElementById('t-bk').textContent   = bk;
  document.getElementById('t-hold').textContent = hold;
  document.getElementById('t-nr').textContent   = nr;
  document.getElementById('m-conv').textContent = inq>0 ? Math.round(bk/inq*100)+'%' : '—';
  document.getElementById('m-hold').textContent = inq>0 ? Math.round(hold/inq*100)+'%' : '—';
  document.getElementById('m-nr').textContent   = inq>0 ? Math.round(nr/inq*100)+'%' : '—';
}

function showWeekSummary(){
  const wrap = document.getElementById('weekSummaryWrap');
  let html = `<table class="dt"><thead><tr><th>채널</th><th>예약문의</th><th>예약성공</th><th>보류</th><th>무응답</th></tr></thead><tbody>`;
  let tI=0,tB=0,tH=0,tN=0;
  CH.forEach(ch => {
    let inq=0,bk=0,hold=0,nr=0;
    for(let i=0;i<7;i++){ const ds=weekDay(curWeek,i); inq+=store[ds]?.[ch]?.inq||0; bk+=store[ds]?.[ch]?.bk||0; hold+=store[ds]?.[ch]?.hold||0; nr+=store[ds]?.[ch]?.nr||0; }
    tI+=inq; tB+=bk; tH+=hold; tN+=nr;
    html += `<tr><td>${ch}</td><td>${inq}</td><td>${bk}</td><td>${hold}</td><td>${nr}</td></tr>`;
  });
  html += `</tbody><tfoot><tr><td>합계</td><td>${tI}</td><td>${tB}</td><td>${tH}</td><td>${tN}</td></tr></tfoot></table>`;
  wrap.innerHTML = html;
}

function setView(v){
  histView = v;
  document.querySelectorAll('.view-toggle .vt').forEach((b,i) => b.classList.toggle('active', ['day','week'][i] === v));
  renderHistory();
}

function renderHistory(){
  const el = document.getElementById('historyWrap');
  const allDates = Object.keys(store).sort().reverse();
  if(!allDates.length){ el.innerHTML='<div class="empty">저장된 데이터가 없습니다.</div>'; return; }
  if(histView === 'day'){
    let h = `<table class="ht"><thead><tr><th>날짜</th><th>요일</th><th>예약문의</th><th>예약성공</th><th>전환율</th><th>보류</th><th>무응답</th><th></th></tr></thead><tbody>`;
    allDates.forEach(ds => {
      let inq=0,bk=0,hold=0,nr=0;
      CH.forEach(ch => { inq+=store[ds][ch]?.inq||0; bk+=store[ds][ch]?.bk||0; hold+=store[ds][ch]?.hold||0; nr+=store[ds][ch]?.nr||0; });
      const d = parseLocal(ds);
      const conv = inq>0 ? Math.round(bk/inq*100)+'%' : '—';
      h += `<tr><td>${d.getMonth()+1}/${d.getDate()}</td><td>${DAY_NAMES[dayIndex(ds)]}</td><td>${inq}</td><td>${bk}</td><td><span class="badge">${conv}</span></td><td>${hold}</td><td>${nr}</td><td><button class="del-btn" onclick="delDay('${ds}')">삭제</button></td></tr>`;
    });
    h += '</tbody></table>';
    el.innerHTML = h;
  } else {
    const weeks = [...new Set(allDates.map(ds => getMonday(ds)))].sort().reverse();
    let h = `<table class="ht"><thead><tr><th>주차</th><th>예약문의</th><th>예약성공</th><th>전환율</th><th>보류</th><th>무응답</th></tr></thead><tbody>`;
    weeks.forEach(wk => {
      let inq=0,bk=0,hold=0,nr=0;
      for(let i=0;i<7;i++){ const ds=weekDay(wk,i); CH.forEach(ch => { inq+=store[ds]?.[ch]?.inq||0; bk+=store[ds]?.[ch]?.bk||0; hold+=store[ds]?.[ch]?.hold||0; nr+=store[ds]?.[ch]?.nr||0; }); }
      const conv = inq>0 ? Math.round(bk/inq*100)+'%' : '—';
      h += `<tr class="week-total"><td>${fmtWeek(wk)}</td><td>${inq}</td><td>${bk}</td><td><span class="badge">${conv}</span></td><td>${hold}</td><td>${nr}</td></tr>`;
    });
    h += '</tbody></table>';
    el.innerHTML = h;
  }
}

function delDay(ds){
  const d = parseLocal(ds);
  if(!confirm(`${d.getMonth()+1}/${d.getDate()} 데이터를 삭제할까요?`)) return;
  delete store[ds]; persist(); renderHistory();
}

function linreg(ys){
  const n = ys.length; if(n === 0) return [];
  let sx=0, sy=0, sxx=0, sxy=0;
  for(let i=0;i<n;i++){ sx+=i; sy+=ys[i]; sxx+=i*i; sxy+=i*ys[i]; }
  const denom = n*sxx - sx*sx;
  const b = denom === 0 ? 0 : (n*sxy - sx*sy) / denom;
  const a = (sy - b*sx) / n;
  return ys.map((_, i) => Math.max(0, a + b*i));   // 음수 방지
}

function renderCharts(){
  const dates = Object.keys(store).sort();
  if(!dates.length) return;
  if(chartM){ chartM.destroy(); chartM=null; }
  if(chartC){ chartC.destroy(); chartC=null; }
  const lbs = dates.map(ds => fmtShort(ds));
  const T = dates.map(ds => {
    let inq=0,bk=0,hold=0,nr=0;
    CH.forEach(ch => { inq+=store[ds][ch]?.inq||0; bk+=store[ds][ch]?.bk||0; hold+=store[ds][ch]?.hold||0; nr+=store[ds][ch]?.nr||0; });
    return {inq,bk,hold,nr};
  });
  const ctx = document.getElementById('mainChart').getContext('2d');
  if(curMode==='overview'){
    chartM = new Chart(ctx,{type:'line',data:{labels:lbs,datasets:[
      {label:'예약문의',data:T.map(t=>t.inq),borderColor:'#0EA5A0',backgroundColor:'rgba(14,165,160,0.08)',tension:0.3,pointRadius:3,fill:true},
      {label:'예약성공',data:T.map(t=>t.bk),borderColor:'#059669',backgroundColor:'rgba(5,150,105,0.07)',tension:0.3,pointRadius:3,fill:true,borderDash:[5,3]},
      {label:'보류',data:T.map(t=>t.hold),borderColor:'#d97706',backgroundColor:'rgba(217,119,6,0.05)',tension:0.3,pointRadius:3,fill:true,borderDash:[3,4]},
      {label:'무응답',data:T.map(t=>t.nr),borderColor:'#9AA6B2',backgroundColor:'rgba(156,163,175,0.05)',tension:0.3,pointRadius:3,fill:true,borderDash:[2,5]},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:12},usePointStyle:true}}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}},x:{ticks:{autoSkip:true,maxTicksLimit:14,maxRotation:45}}}}});
  } else if(curMode==='channel'){
    const maxTotal = Math.max(1, ...dates.map(ds => CH.reduce((s,ch)=> s + (store[ds][ch]?.bk||0), 0)));
    const barSets = CH.map((ch,i)=>({
      type:'bar', label:ch, data:dates.map(ds=>store[ds][ch]?.bk||0),
      backgroundColor:COLORS[i]+'99', borderColor:COLORS[i], borderWidth:1.5, yAxisID:'y', order:2, stack:'ch'
    }));
    const trendSets = (showTrend ? CH.map((ch,i)=>{
      const ys = dates.map(ds=>store[ds][ch]?.bk||0);
      if(!ys.some(v=>v>0)) return null;   // 값이 있는 채널만 추세선
      return {
        type:'line', label:ch+' 추세', data:linreg(ys),
        borderColor:COLORS[i], borderWidth:2.5, borderDash:[7,4],
        pointRadius:0, fill:false, tension:0, yAxisID:'y2', order:1
      };
    }).filter(Boolean) : []);
    chartM = new Chart(ctx,{type:'bar',data:{labels:lbs,datasets:[...barSets,...trendSets]},options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:12},usePointStyle:true,
        filter:(item)=> !/ 추세$/.test(item.text)}}},   // 범례엔 채널만, 추세선은 숨김
      scales:{
        x:{stacked:true,ticks:{autoSkip:true,maxTicksLimit:14,maxRotation:45}},
        y:{stacked:true,beginAtZero:true,min:0,max:maxTotal+1},
        y2:{position:'right',display:false,min:0,max:maxTotal+1}
      }}});
  } else {
    const convArr = T.map(t=> t.inq>0 ? Math.round(t.bk/t.inq*100) : 0);
    const holdArr = T.map(t=> t.inq>0 ? Math.round(t.hold/t.inq*100) : 0);
    const base = [
      {label:'전환율(%)', data:convArr, borderColor:'#1E8E54', backgroundColor:'rgba(30,142,84,0.06)', tension:0.3, pointRadius:3, fill:true},
      {label:'보류율(%)', data:holdArr, borderColor:'#D97706', backgroundColor:'rgba(217,119,6,0.05)', tension:0.3, pointRadius:3, fill:false},
    ];
    const trends = showTrend ? [
      {label:'전환율 추세', data:linreg(convArr), borderColor:'#1E8E54', borderWidth:2.5, borderDash:[7,4], pointRadius:0, fill:false, tension:0},
      {label:'보류율 추세', data:linreg(holdArr), borderColor:'#D97706', borderWidth:2.5, borderDash:[7,4], pointRadius:0, fill:false, tension:0},
    ] : [];
    chartM = new Chart(ctx,{type:'line',data:{labels:lbs,datasets:[...base,...trends]},options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:12},usePointStyle:true,filter:(item)=> !/ 추세$/.test(item.text)}}},
      scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}},x:{ticks:{autoSkip:true,maxTicksLimit:14,maxRotation:45}}}}});
  }
  const ctx2 = document.getElementById('chChart').getContext('2d');
  chartC = new Chart(ctx2,{type:'bar',data:{labels:CH,datasets:[{label:'누적 예약문의',data:CH.map(ch=>dates.reduce((s,ds)=>s+(store[ds][ch]?.inq||0),0)),backgroundColor:COLORS.map(c=>c+'BB'),borderColor:COLORS,borderWidth:1.5,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}}}}});
}

function switchChart(mode){
  curMode = mode;
  document.querySelectorAll('#ctoggle .ctab:not(.trend-toggle)').forEach((b,i) => b.classList.toggle('active', ['overview','channel','rate'][i]===mode));
  renderCharts();
}
function toggleTrend(){
  showTrend = !showTrend;
  document.getElementById('trendToggle').classList.toggle('active', showTrend);
  renderCharts();
}

function showTab(name){
  ['input','history','chart'].forEach(t => { document.getElementById('tab-'+t).classList.toggle('active', t===name); });
  document.querySelectorAll('.tab-bar .tab').forEach((b,i) => b.classList.toggle('active', ['input','history','chart'][i]===name));
  if(name==='history') renderHistory();
  if(name==='chart') renderCharts();
}

function initWeek(todayStr){
  curWeek = getMonday(todayStr);         // 항상 월요일
  curDayIdx = dayIndex(todayStr);        // 오늘 요일 (월=0 ... 일=6)
  document.getElementById('weekStart').value = curWeek;
  document.getElementById('weekLbl').textContent = fmtWeek(curWeek);
  buildDayTabs();
  loadDay();
}

function applyWeek(dayIdx){
  document.getElementById('weekStart').value = curWeek;
  document.getElementById('weekLbl').textContent = fmtWeek(curWeek);
  curDayIdx = (dayIdx == null) ? 0 : dayIdx;
  buildDayTabs();
  loadDay();
}
function shiftWeek(delta){
  const d = parseLocal(curWeek);
  d.setDate(d.getDate() + delta * 7);
  curWeek = toYMD(d);
  applyWeek(0);
}
function thisWeek(){
  const t = toYMD(new Date());
  curWeek = getMonday(t);
  applyWeek(dayIndex(t));
}

document.getElementById('weekStart').addEventListener('change', function(){
  if(!this.value) return;
  curWeek = getMonday(this.value);
  this.value = curWeek;
  document.getElementById('weekLbl').textContent = fmtWeek(curWeek);
  curDayIdx = 0;
  buildDayTabs();
  loadDay();
});

buildTable();

  const ind = document.getElementById('saveIndicator');
  ind.textContent = '↻ 동기화 중…'; ind.style.color = '#8fd3ff'; ind.classList.add('show');
  cloudPull().then(function(ok){
    if(ok){
      buildDayTabs(); loadDay();
      if(document.getElementById('tab-history').classList.contains('active')) renderHistory();
    }
    ind.textContent = ok ? '● 구글 시트 연결됨' : '● 동기화 실패 · 로컬 사용';
    ind.style.color = ok ? '#7fe3dd' : '#ffb84d';
    ind.classList.add('show');
    if(ok) setTimeout(()=>ind.classList.remove('show'), 2000);
  });
}
