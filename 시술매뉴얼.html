<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시술매뉴얼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#14161B; --muted:#697180; --faint:#98A0AD;
  --line:#E6E8EC; --line2:#EEF0F3;
  --eq:#0E8074; --eq-tint:#E3F1EF; --eq-ink:#0A5E55;      /* 장비 */
  --inj:#5A4FC7; --inj-tint:#ECEAFB; --inj-ink:#443AA0;   /* 주사제 */
  --iv:#2563C9;  --iv-tint:#E4ECFB;  --iv-ink:#1D4FA6;    /* 수액제 */
  --nz:#B26A00;  --nz-tint:#FAEFD9;  --nz-ink:#8A5200;    /* 간호준비 */
  --sk:#C2477A;  --sk-tint:#FBE7F0;  --sk-ink:#9B3360;    /* 피부관리 */
  /* 카테고리 색 (장비→피부관리) */
  --r1:#E23B3B; --r1t:#FCEBEB; --r1i:#A32D2D;  /* 장비 빨강 */
  --r2:#E8792A; --r2t:#FBEEE1; --r2i:#9E4E12;  /* 주사제 주황 */
  --r3:#D14D8B; --r3t:#FBE9F1; --r3i:#9B3364;  /* 실리프팅 로즈 */
  --r4:#EAB308; --r4t:#FBF3D6; --r4i:#8A6608;  /* 수액 노랑 */
  --r5:#2E9E4F; --r5t:#E7F4EC; --r5i:#1E7A44;  /* 간호준비 초록 */
  --r6:#2E72D2; --r6t:#E4EEFB; --r6i:#1D4FA6;  /* 피부관리 파랑 */
  --rgray:#6B7280; --rgrayt:#F0F1F3; --rgrayi:#4B515C; /* 삭제항목 회색 */
  --shadow:0 1px 2px rgba(20,22,27,.04), 0 8px 24px rgba(20,22,27,.06);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:56px}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* Topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,245,247,.85);backdrop-filter:saturate(1.8) blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px 12px}
.brandbar{display:flex;align-items:center;gap:11px;overflow-x:auto;scrollbar-width:none}
.logo{height:34px;width:auto;display:block}
.divider{width:1px;height:24px;background:var(--line);flex:0 0 auto}
.brandbar h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand-right{margin-left:auto;display:flex;align-items:center;gap:7px;white-space:nowrap;flex:0 0 auto}
.today{font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:.15s}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#C6CBD3}
.sync-pill[data-s="ok"]{color:var(--eq-ink);border-color:var(--eq-tint);background:var(--eq-tint)}
.sync-pill[data-s="ok"] .dot{background:var(--eq)}
.sync-pill[data-s="syncing"]{color:var(--inj-ink)}
.sync-pill[data-s="syncing"] .dot{background:var(--inj);animation:pulse 1s infinite}
.sync-pill[data-s="error"]{color:#B4472F;background:#FBE7E1;border-color:#F3D3CA}
.sync-pill[data-s="error"] .dot{background:#C0492E}
.sync-pill[data-s="off"]{color:var(--nz-ink);background:var(--nz-tint);border-color:#F0DCB8}
.sync-pill[data-s="off"] .dot{background:var(--nz)}
@keyframes pulse{50%{opacity:.35}}
.top-actions{display:none!important}
.search{position:relative;margin-top:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 12px 42px;font-size:15px;font-family:inherit;color:var(--ink);transition:border-color .15s, box-shadow .15s}
.search input:focus{outline:none;border-color:var(--eq);box-shadow:0 0 0 3px var(--eq-tint)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--faint)}
.catrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;font-family:inherit}
.tab .n{font-size:12px;color:inherit;opacity:.62;font-weight:700}
.tab:hover{filter:brightness(.97)}
/* 기본(resting) 색 */
.tab[data-d="장비"]{background:var(--r1t);border-color:var(--r1t);color:var(--r1i)}
.tab[data-d="주사제"]{background:var(--r2t);border-color:var(--r2t);color:var(--r2i)}
.tab[data-d="실리프팅"]{background:var(--r3t);border-color:var(--r3t);color:var(--r3i)}
.tab[data-d="수액"]{background:var(--r4t);border-color:var(--r4t);color:var(--r4i)}
.tab[data-d="간호준비"]{background:var(--r5t);border-color:var(--r5t);color:var(--r5i)}
.tab[data-d="피부관리"]{background:var(--r6t);border-color:var(--r6t);color:var(--r6i)}
.tab[data-d="전체"]{background:#EAEBEE;border-color:#EAEBEE;color:#3A3D44}
.tab[data-d="삭제항목"]{background:var(--rgrayt);border-color:var(--rgrayt);color:var(--rgrayi)}
/* 선택(filled) 색 */
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[data-d="장비"][aria-selected="true"]{background:var(--r1);border-color:var(--r1);color:#fff}
.tab[data-d="주사제"][aria-selected="true"]{background:var(--r2);border-color:var(--r2);color:#fff}
.tab[data-d="실리프팅"][aria-selected="true"]{background:var(--r3);border-color:var(--r3);color:#fff}
.tab[data-d="수액"][aria-selected="true"]{background:var(--r4);border-color:var(--r4);color:#5A4300}
.tab[data-d="간호준비"][aria-selected="true"]{background:var(--r5);border-color:var(--r5);color:#fff}
.tab[data-d="피부관리"][aria-selected="true"]{background:var(--r6);border-color:var(--r6);color:#fff}
.tab[data-d="전체"][aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[data-d="삭제항목"][aria-selected="true"]{background:var(--rgray);border-color:var(--rgray);color:#fff}

/* Toolbar */
main{max-width:1180px;margin:0 auto;padding:18px 20px}
.toolbar{display:none}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink);font-weight:700}
.toolbar-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.tbtn:hover{border-color:#D3D7DE;color:var(--ink)}
.tbtn svg{width:15px;height:15px}
.tbtn .tcount{background:rgba(255,255,255,.6);color:inherit;border-radius:6px;padding:0 6px;font-size:11px;margin-left:1px}
.tbtn.c-save{background:#12A05C;border-color:#12A05C;color:#fff}
.tbtn.c-save:hover{filter:brightness(1.07);color:#fff}
.tbtn.c-excel{background:#E7F4EC;border-color:#C3E4D0;color:#1E7A44}
.tbtn.c-excel:hover{border-color:#1E7A44;color:#155C33}
.tbtn.c-json{background:var(--inj-tint);border-color:#D8D3F5;color:var(--inj-ink)}
.tbtn.c-json:hover{border-color:var(--inj);color:var(--inj-ink)}
.tbtn.c-trash{background:#FBEEEA;border-color:#F3D3CA;color:#B4472F}
.tbtn.c-trash:hover{border-color:#B4472F;color:#8F3623}
.tbtn.c-set{background:#EEF1F6;border-color:#DAE0EA;color:#3D5573}
.tbtn.c-set:hover{border-color:#3D5573;color:#2C405A}
.tbtn.warn:hover{border-color:#F3D3CA;color:#B4472F;background:#FBE7E1}
.addbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--eq);background:var(--eq);color:#fff;border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.addbtn:hover{filter:brightness(1.06)}
.addbtn svg{width:15px;height:15px}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:11px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;font-family:inherit;color:inherit;transition:transform .12s, box-shadow .12s, border-color .12s;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.card[data-d="장비"]::before{background:var(--r1)}
.card[data-d="주사제"]::before{background:var(--r2)}
.card[data-d="실리프팅"]::before{background:var(--r3)}
.card[data-d="수액"]::before{background:var(--r4)}
.card[data-d="간호준비"]::before{background:var(--r5)}
.card[data-d="피부관리"]::before{background:var(--r6)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#DADEE4}
.card:focus-visible{outline:2px solid var(--eq);outline-offset:2px}
.card.off{opacity:.58}
.card-top{display:flex;align-items:center;gap:7px}
.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--line2);color:var(--muted)}
.badge-장비{background:var(--r1t);color:var(--r1i)}
.badge-주사제{background:var(--r2t);color:var(--r2i)}
.badge-실리프팅{background:var(--r3t);color:var(--r3i)}
.badge-수액{background:var(--r4t);color:var(--r4i)}
.badge-간호준비{background:var(--r5t);color:var(--r5i)}
.badge-피부관리{background:var(--r6t);color:var(--r6i)}
.card-cat{font-size:11.5px;color:var(--faint);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title-row{display:flex;align-items:center;gap:7px;min-width:0}
.card h3{font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.rx-badge-card{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:11px;font-weight:800;color:#fff;background:#E23B3B;border-radius:6px;padding:3px 8px;line-height:1.2}
.card.owner-draggable{cursor:grab}
.card.owner-draggable:active{cursor:grabbing}
.card.dragging{opacity:.42;transform:scale(.985)}
.card.drop-before{box-shadow:inset 0 3px 0 #0E8074}
.card.drop-after{box-shadow:inset 0 -3px 0 #0E8074}
.card .tag{font-size:12.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-metas{display:flex;flex-wrap:wrap;gap:5px;margin-top:1px}
.meta{font-size:11px;font-weight:600;color:var(--muted);background:var(--line2);border-radius:5px;padding:2px 7px;display:inline-flex;align-items:center;gap:3px}
.meta.rx{color:var(--inj-ink);background:var(--inj-tint)}
.meta .mlabel{font-weight:800;color:var(--faint);margin-right:3px}
.meta.off{color:#B4472F;background:#FBE7E1}
.empty{text-align:center;padding:70px 20px;color:var(--muted);grid-column:1/-1}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}

/* Modal / sheet */
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,22,27,.42);backdrop-filter:blur(2px);animation:fade .2s}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(580px,100%);background:var(--surface);box-shadow:-8px 0 40px rgba(20,22,27,.16);overflow-y:auto;animation:slide .28s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.5}}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:18px 176px 14px 22px;z-index:2}
.sheet-head .card-top{margin-bottom:8px}
.sheet-head h2{font-size:23px;font-weight:800;letter-spacing:-.02em}
.sheet-head .tag{font-size:14px;color:var(--muted);margin-top:4px}
.sheet-metas{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.head-actions{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:6}
.icon-btn{width:34px;height:34px;border:none;background:var(--line2);border-radius:9px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:#E2E5EA;color:var(--ink)}
.edit-btn{width:auto;padding:0 14px;gap:6px;font-size:13.5px;font-weight:700;background:var(--ink);color:#fff}
.edit-btn:hover{background:#000;color:#fff}
.edit-btn svg{width:15px;height:15px}
.sheet-body{padding:8px 22px 44px}
.sec{padding:9px 0;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:none}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:7px}
.sec-h::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--eq)}
.sheet[data-d="장비"] .sec-h::before{background:var(--r1)}
.sheet[data-d="주사제"] .sec-h::before{background:var(--r2)}
.sheet[data-d="실리프팅"] .sec-h::before{background:var(--r3)}
.sheet[data-d="수액"] .sec-h::before{background:var(--r4)}
.sheet[data-d="간호준비"] .sec-h::before{background:var(--r5)}
.sheet[data-d="피부관리"] .sec-h::before{background:var(--r6)}
.eff{display:flex;flex-wrap:wrap;gap:6px}
.eff span{font-size:13.5px;font-weight:600;color:var(--ink);background:var(--line2);border-radius:999px;padding:4px 11px}
.plist{display:flex;flex-direction:column;gap:1px}
.pitem{display:flex;gap:11px;align-items:flex-start;padding:5px 10px;border-radius:9px;cursor:pointer;transition:background .12s}
.pitem:hover{background:var(--line2)}
.pbox{flex:0 0 20px;width:20px;height:20px;border:2px solid #CBD0D8;border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.12s}
.pbox svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}
.pitem.done .pbox{background:var(--eq);border-color:var(--eq)}
.pitem.done .pbox svg{opacity:1}
.pitem.done .ptext{color:var(--faint);text-decoration:line-through}
.ptext{font-size:14px;line-height:1.45}
.prep-reset{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;padding:3px 0;text-decoration:underline;text-underline-offset:3px}
.prep-reset:hover{color:var(--ink)}
.steps{counter-reset:s;display:flex;flex-direction:column}
.step{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line2)}
.step:last-child{border-bottom:none}
.step .num{counter-increment:s;flex:0 0 24px;height:24px;border-radius:7px;background:var(--eq-tint);color:var(--eq-ink);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sheet[data-d="장비"] .step .num{background:var(--r1t);color:var(--r1i)}
.sheet[data-d="주사제"] .step .num{background:var(--r2t);color:var(--r2i)}
.sheet[data-d="실리프팅"] .step .num{background:var(--r3t);color:var(--r3i)}
.sheet[data-d="수액"] .step .num{background:var(--r4t);color:var(--r4i)}
.sheet[data-d="간호준비"] .step .num{background:var(--r5t);color:var(--r5i)}
.sheet[data-d="피부관리"] .step .num{background:var(--r6t);color:var(--r6i)}
.step .num::before{content:counter(s)}
.step .txt{font-size:14px;line-height:1.45;padding-top:2px}
.mixbox{white-space:pre-wrap;background:linear-gradient(180deg,#FBFCFD,#F6F8FA);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;color:var(--ink)}
.dose-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
table.dose{width:100%;border-collapse:collapse;font-size:13px}
table.dose th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:7px 10px;border-bottom:1.5px solid var(--line)}
table.dose td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.45}
table.dose td:first-child{font-weight:700;white-space:nowrap}
table.dose tr:last-child td{border-bottom:none}
.ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.ul li{font-size:14px;line-height:1.45;padding-left:16px;position:relative;color:var(--ink)}
.ul li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:#C6CBD3}
.ul.note li{color:var(--muted);font-size:13.5px}
.ul.after li::before{background:var(--nz)}
.modes{display:flex;flex-direction:column;gap:5px}
.mode{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--line2);border-radius:9px;padding:6px 12px}

/* Edit form */
.edit-body{padding:18px 22px 120px}
.ef{margin-bottom:16px}
.ef-label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--faint);text-transform:uppercase;margin-bottom:7px}
.ef input[type=text],.ef textarea,.ef select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.ef input:focus,.ef textarea:focus,.ef select:focus{outline:none;border-color:var(--eq);box-shadow:0 0 0 3px var(--eq-tint)}
.ef textarea{resize:vertical;min-height:56px;line-height:1.5}
.ef-row{display:flex;gap:10px;flex-wrap:wrap}
.ef-row .ef{flex:1;min-width:120px}
.ef-hint{font-size:11.5px;color:var(--faint);margin-top:5px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;cursor:pointer;padding:8px 0}
.chk input{width:18px;height:18px;accent-color:var(--eq)}
.subcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#FAFBFC}
.dgrid{display:flex;flex-direction:column;gap:6px}
.dgrid .drow{display:flex;gap:6px}
.dgrid .drow input{flex:1;padding:8px 9px;font-size:13px;border:1px solid var(--line);border-radius:7px;font-family:inherit}
.dgrid .drow.head input{font-weight:700;background:var(--line2)}
.line-del{flex:0 0 34px;width:34px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.line-del:hover{background:#FBE7E1;border-color:#F3D3CA;color:#B4472F}
.mini-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.mini-btn{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.mini-btn:hover{border-color:var(--eq);color:var(--eq-ink)}
.edit-actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:center;z-index:3;margin:0 -22px}
.btn{border:none;border-radius:10px;padding:12px 18px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.btn-save{background:var(--eq);color:#fff;flex:1}
.btn-save:hover{filter:brightness(1.06)}
.btn-cancel{background:var(--line2);color:var(--muted)}
.btn-cancel:hover{background:#E2E5EA;color:var(--ink)}
.btn-del{background:#FBECEA;color:#B4472F;border:1px solid #F1CFC7;margin-right:auto;padding:12px 16px;border-radius:10px}
.btn-del:hover{background:#F6DBD5;border-color:#E3B3A8}

/* Trash / backup view */
.mgr-sec{padding:18px 0;border-bottom:1px solid var(--line2)}
.mgr-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line2)}
.mgr-row:last-child{border-bottom:none}
.mgr-row .info{flex:1;min-width:0}
.mgr-row .nm{font-size:14.5px;font-weight:700}
.mgr-row .sub{font-size:12px;color:var(--faint);margin-top:2px}
.mgr-row .acts{display:flex;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.sbtn:hover{border-color:#D3D7DE;color:var(--ink)}
.sbtn.warn{color:#B4472F}
.sbtn.warn:hover{background:#FBE7E1;border-color:#F3D3CA}
.mgr-empty{color:var(--faint);font-size:13.5px;padding:8px 0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{max-width:1180px;margin:0 auto;padding:0 20px;text-align:center}
.foot{border-top:1px solid var(--line);margin-top:24px;padding:20px 0;color:var(--faint);font-size:12.5px;line-height:1.6}

@media (max-width:640px){
  .brandbar h1{font-size:18px}
  .top-actions{overflow-x:auto;justify-content:flex-end}
  .catrow{gap:8px}
  .catrow .addbtn{padding:8px 10px}
  main{padding:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .card{padding:12px}.card h3{font-size:15px}
  .sheet{width:100%}
  .sheet-body,.edit-body{padding-left:18px;padding-right:18px}
  .sheet-head{padding:18px 154px 14px 18px}
  .edit-actions{margin:0 -18px;padding:14px 18px}
}
.rx-flag{display:inline-block;vertical-align:middle;margin-left:9px;font-size:12.5px;font-weight:800;color:#fff;background:#E23B3B;border-radius:7px;padding:3px 10px;letter-spacing:.02em;transform:translateY(-2px)}

/* 인쇄 */
.print-only{display:none}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%}
  @page{margin:14mm}
}
#printArea{font-family:inherit;color:#000;line-height:1.5}
#printArea .p-brand{font-size:10pt;color:#666;margin:0 0 2mm}
#printArea h1{font-size:22pt;margin:0 0 2mm}
#printArea .p-rx{color:#C0202A;font-weight:800;font-size:13pt}
#printArea .p-sub{font-size:11pt;color:#444;margin:0 0 1mm}
#printArea .p-meta{font-size:10.5pt;color:#222;margin:2mm 0 3mm}
#printArea h2{font-size:12pt;border-bottom:1px solid #999;padding-bottom:1mm;margin:5mm 0 2mm}
#printArea ul,#printArea ol{margin:0;padding-left:7mm;font-size:11pt}
#printArea .p-eff{font-size:11pt}
#printArea .p-chk{list-style:none;padding-left:0}
#printArea .p-chk li{margin:1.4mm 0}
#printArea .p-chk li::before{content:"\2610  ";font-size:12pt}
#printArea .p-mix{white-space:pre-wrap;font-size:11pt;border:1px solid #bbb;padding:2mm 3mm;border-radius:2mm}
#printArea table{border-collapse:collapse;width:100%;font-size:10.5pt;margin-top:1mm}
#printArea th,#printArea td{border:1px solid #aaa;padding:1.5mm 2mm;text-align:left;vertical-align:top}
#printArea .dose-t{font-weight:700;margin-bottom:1mm}

const $ = s => document.querySelector(s);

/* ---------- 데이터 정규화 + 카테고리 이관 ---------- */
function toMixText(x){
  let lines=[];
  if(x.recipe){
    const r=x.recipe;
    if(r.title) lines.push("["+r.title+"]");
    if(r.parts&&r.parts.length){ const f=r.parts.map(p=>p.n+(p.q?" "+p.q:"")).join(" ＋ "); lines.push(f+(r.total&&r.total!=="—"?" ＝ "+r.total:"")); }
    else if(r.total&&r.total!=="—"){ lines.push("＝ "+r.total); }
    if(r.note) lines.push(r.note);
  }
  if(Array.isArray(x.mix)) lines=lines.concat(x.mix.filter(Boolean));
  else if(typeof x.mix==="string" && x.mix.trim()) lines.push(x.mix.trim());
  return lines.join("\n");
}
const ARR_KEYS=["effects","modes","prep","setting","steps","charting","after","notes"];
function migrateDomain(x){
  // 카테고리 이관: 실리프팅 분리 / 수액제→수액 / 조제→간호준비
  if(x.id==="silthread" || x.name==="실리프팅") return "실리프팅";
  if(x.domain==="수액제" || x.cat==="수액" || x.name==="수액센터") return "수액";
  if(x.domain==="조제") return "간호준비";
  if(CATEGORIES.indexOf(x.domain)>=0) return x.domain;
  return x.domain||"장비";
}
function normalize(items){
  return (items||[]).map(x=>{
    const o=Object.assign({},x);
    o.domain=migrateDomain(o);
    o.mix=toMixText(o); delete o.recipe;
    ARR_KEYS.forEach(k=>{ if(!Array.isArray(o[k])) o[k]=(o[k]?[o[k]]:[]); });
    if(!o.id) o.id=uid();
    return o;
  });
}
function collectConfigFrom(items){
  const cats=new Set(CONFIG.cats), rooms=new Set(CONFIG.rooms), doms=new Set(CONFIG.domains);
  items.forEach(x=>{ if(x.cat)cats.add(x.cat); if(x.room)rooms.add(x.room); if(x.domain)doms.add(x.domain); });
  CONFIG.cats=[...cats]; CONFIG.rooms=[...rooms]; CONFIG.domains=[...doms];
}
DATA = normalize(DATA);

/* ---------- 토스트 ---------- */
let toastT=null;

/* ---------- 동기화 UI ---------- */
function setSync(s){ const p=$("#syncPill"),t=$("#syncText"); p.dataset.s=(s==="connected"?"ok":s); t.textContent={connected:"연결됨",ok:"저장됨",syncing:"저장 중…",error:"연결 오류",off:"오프라인"}[s]||s; }
$("#syncPill") && ($("#syncPill").onclick=()=>{ if(!CLOUD_URL){ toast("배포 URL이 아직 설정되지 않았어요"); return; } pullCloud(true); });

/* ---------- 클라우드 읽기 (JSONP) ---------- */
function pullCloud(manual){
  if(!CLOUD_URL){ setSync("off"); return; }
  setSync("syncing");
  const cb="__ecb"+Date.now(); const s=document.createElement("script"); let done=false;
  window[cb]=function(res){
    done=true;
    try{
      if(res && res.ok){
        if(res.data && res.data.length>2){
          const parsed=JSON.parse(res.data);
          if(Array.isArray(parsed)){ DATA=normalize(parsed); }
          else if(parsed && parsed.items){
            DATA=normalize(parsed.items);
            if(parsed.config) CONFIG=Object.assign(CONFIG,parsed.config);
            if(Array.isArray(parsed.trash)) TRASH=parsed.trash;
            if(Array.isArray(parsed.backups)) BACKUPS=parsed.backups;
            if(parsed.meta) META=Object.assign(META,parsed.meta);
          }
          collectConfigFrom(DATA);
          applyAccountTab();
          syncedOK=true; setSync("connected"); if(manual) toast("최신 내용을 불러왔어요");
          weeklyAutoSave();
        } else { syncedOK=true; pushCloud(true); setSync("connected"); }
      } else setSync("error");
    }catch(err){ setSync("error"); }
    render(); cleanup();
  };
  function cleanup(){ try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); }
  s.onerror=function(){ if(done)return; setSync("error"); cleanup(); };
  s.src=CLOUD_URL+(CLOUD_URL.indexOf("?")<0?"?":"&")+"callback="+cb+"&t="+Date.now();
  document.body.appendChild(s);
  setTimeout(()=>{ if(!done){ setSync("error"); cleanup(); } },12000);
}

/* ---------- 클라우드 쓰기 (no-cors POST) ---------- */
function payload(){ return JSON.stringify({items:DATA,trash:TRASH,backups:BACKUPS,config:CONFIG,meta:META}); }
function pushCloud(immediate){
  if(!CLOUD_URL) return;
  if(!syncedOK) return;
  if(!Array.isArray(DATA)) return;
  clearTimeout(pushTimer);
  const run=function(){
    setSync("syncing");
    fetch(CLOUD_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"save",data:payload()})})
      .then(()=>setSync("ok")).catch(()=>setSync("error"));
  };
  if(immediate) run(); else pushTimer=setTimeout(run,700);
}
function saveData(msg){ render(); pushCloud(); if(window.euBackupSnapshot) euBackupSnapshot(APP_NAME,payload()); if(msg) toast(msg); }

/* ---------- 드라이브 백업 폴더로 전송 (재고관리 방식) ---------- */
function cloudBackup(op){
  if(!CLOUD_URL) return false;
  try{ fetch(CLOUD_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(op)}); return true; }
  catch(e){ return false; }
}

/* ---------- 주간 자동저장 (앱 내 스냅샷 + 드라이브 백업 폴더) ---------- */
function weeklyAutoSave(){
  if(!syncedOK) return;
  const now=Date.now();
  if(now-(META.lastAuto||0) < WEEK) return;
  // 1) 앱 안 스냅샷 (한 번에 복원용, 최근 4개)
  BACKUPS.unshift({ ts:now, items:JSON.parse(JSON.stringify(DATA)), config:JSON.parse(JSON.stringify(CONFIG)) });
  BACKUPS=BACKUPS.slice(0,4);
  META.lastAuto=now;
  // 2) 드라이브 백업 폴더에 주간 JSON 파일 저장
  cloudBackup({ type:"driveJson", name:APP_NAME+"_주간백업_"+ymd()+".json", content:payload() });
  pushCloud(true);
}

/* ---------- 탭 ---------- */
function renderTabs(){
  const t=$("#tabs"); t.innerHTML="";
  DOMAINS.forEach(d=>{
    const isTrashTab = d==="삭제항목";
    const n = isTrashTab ? TRASH.length : (d==="전체"?DATA.length:DATA.filter(x=>x.domain===d).length);
    const b=document.createElement("button");

    b.setAttribute("aria-selected", (!isTrashTab && state.domain===d));

      : (()=>{ state.domain=d; saveLastTab(d); renderTabs(); renderGrid(); });
    t.appendChild(b);
  });
}
/* ---------- 필터 ---------- */
function match(x){
  if(state.domain!=="전체"&&x.domain!==state.domain) return false;
  if(state.q){
    const hay=[x.name,x.tag,x.cat,x.room,x.anes,(x.effects||[]).join(" "),(x.prep||[]).join(" "),x.mix,(x.notes||[]).join(" ")].join(" ").toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
function metaChips(x,skipRx){
  let h="";
  if(x.anes) h+='<span class="meta"><b class="mlabel">마취</b>'+esc(x.anes)+'</span>';
  if(x.time) h+='<span class="meta">⏱ '+esc(x.time)+'</span>';
  if(x.exp) h+='<span class="meta">📅 '+esc(x.exp)+'</span>';
  if(x.rx && !skipRx) h+='<span class="meta rx">약처방</span>';
  if(x.active===false) h+='<span class="meta off">미시행</span>';
  return h;
}
function renderGrid(){
  const list=DATA.filter(match), g=$("#grid");
  if(!list.length){ g.innerHTML='<div class="empty"><h3>항목이 없어요</h3><p>오른쪽 위 "새 항목"으로 추가하거나 다른 탭을 눌러보세요.</p></div>'; return; }
  g.innerHTML=list.map(x=>{
    const catLine=[x.cat,x.room].filter(Boolean).join(" · ");
    const ownerDrag=isOwner() && !state.q;
    return '<button class="card'+(x.active===false?' off':'')+(ownerDrag?' owner-draggable':'')+'" data-d="'+esc(x.domain)+'" data-id="'+esc(x.id)+'"'+(ownerDrag?' draggable="true"':'')+'>'
      +'<div class="card-top"><span class="badge badge-'+esc(x.domain)+'">'+esc(x.domain)+'</span>'
      +(catLine?'<span class="card-cat">'+esc(catLine)+'</span>':'')+'</div>'
      +'<div class="card-title-row"><h3>'+esc(x.name)+'</h3>'+(x.rx?'<span class="rx-badge-card">약처방</span>':'')+'</div>'+(x.tag?'<p class="tag">'+esc(x.tag)+'</p>':'')
      +'<div class="card-metas">'+metaChips(x,true)+'</div></button>';
  }).join("");
  g.querySelectorAll(".card").forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
  bindCardDrag(g);
}
function bindCardDrag(g){
  if(!isOwner() || state.q) return;
  let dragId=null, moved=false;
  const cards=[...g.querySelectorAll(".card[draggable=\"true\"]")];
  const clearMarks=()=>cards.forEach(c=>c.classList.remove("dragging","drop-before","drop-after"));
  cards.forEach(card=>{
    card.addEventListener("dragstart",e=>{
      dragId=card.dataset.id; moved=false; card.classList.add("dragging");
      if(e.dataTransfer){ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragId); }
    });
    card.addEventListener("dragover",e=>{
      if(!dragId || dragId===card.dataset.id) return;
      e.preventDefault();
      cards.forEach(c=>c.classList.remove("drop-before","drop-after"));
      const r=card.getBoundingClientRect();
      const after=e.clientY > r.top+r.height/2;
      card.classList.add(after?"drop-after":"drop-before");
      if(e.dataTransfer) e.dataTransfer.dropEffect="move";
    });
    card.addEventListener("drop",e=>{
      if(!dragId || dragId===card.dataset.id) return;
      e.preventDefault();
      const r=card.getBoundingClientRect();
      const after=e.clientY > r.top+r.height/2;
      const from=DATA.findIndex(x=>x.id===dragId);
      let to=DATA.findIndex(x=>x.id===card.dataset.id);
      if(from<0 || to<0) return;
      const [item]=DATA.splice(from,1);
      if(from<to) to--;
      if(after) to++;
      DATA.splice(Math.max(0,to),0,item);
      moved=true;
      saveData("카드 순서를 저장했어요");
    });
    card.addEventListener("dragend",()=>{ dragId=null; clearMarks(); if(moved) renderGrid(); });
    card.addEventListener("click",e=>{ if(moved){ e.preventDefault(); e.stopImmediatePropagation(); moved=false; } },true);
  });
}

function printItem(x){

  html+='<h1>'+esc(x.name)+(x.rx?' <span class="p-rx">약처방</span>':'')+'</h1>';
  const sub=[x.domain,catLine].filter(Boolean).join(" · ");
  if(sub) html+='<div class="p-sub">'+esc(sub)+'</div>';
  if(x.tag) html+='<div class="p-sub">'+esc(x.tag)+'</div>';
  const m=[]; if(x.anes)m.push("마취: "+x.anes); if(x.time)m.push("시술시간: "+x.time); if(x.exp)m.push("사용기한: "+x.exp);
  if(x.active===false)m.push("현재 미시행");
  if(m.length) html+='<div class="p-meta">'+esc(m.join("     |     "))+'</div>';
  if(x.effects&&x.effects.length) html+=secp("효과 · 적응증",'<div class="p-eff">'+x.effects.map(esc).join(",  ")+'</div>');
  if(x.modes&&x.modes.length) html+=secp("모드",ulp(x.modes));
  if(x.prep&&x.prep.length) html+=secp("준비물",'<ul class="p-chk">'+x.prep.map(i=>'<li>'+esc(i)+'</li>').join("")+'</ul>');
  if(x.setting&&x.setting.length) html+=secp("시술 준비 · 세팅",ulp(x.setting));
  if(x.mix&&x.mix.trim()) html+=secp("Mix · 수화",'<div class="p-mix">'+esc(x.mix)+'</div>');
  if(x.dose) html+=secp("용량 · 기준",doseHtml(x.dose));
  if(x.steps&&x.steps.length) html+=secp("시술 순서",'<ol>'+x.steps.map(i=>'<li>'+esc(i)+'</li>').join("")+'</ol>');
  if(x.charting&&x.charting.length) html+=secp("차팅",ulp(x.charting));
  if(x.after&&x.after.length) html+=secp("시술 후 · 안내",ulp(x.after));
  if(x.notes&&x.notes.length) html+=secp("특이사항",ulp(x.notes));
  A.innerHTML=html;
  setTimeout(()=>window.print(),60);
}

function commitEdit(sheet,x,isNew){

  if(isNew){ DATA.push(obj); } else { const i=DATA.findIndex(d=>d.id===x.id); if(i>=0)DATA[i]=obj; }
  editingNew=false; saveData(isNew?"추가됐어요":"저장됐어요"); openDetail(obj.id);
}

function fmtDate(ts){ const d=new Date(ts); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

    +'<div class="acts"><button class="sbtn" data-restore="'+esc(it.id)+'">복원</button><button class="sbtn warn" data-purge="'+esc(it.id)+'">완전삭제</button></div></div>'
  ).join("") : '<div class="mgr-empty">삭제한 항목이 없습니다.</div>';
  const bkRows = BACKUPS.length ? BACKUPS.map((b,i)=>
    '<div class="mgr-row"><div class="info"><div class="nm">'+fmtDate(b.ts)+' 자동저장</div><div class="sub">항목 '+(b.items?b.items.length:0)+'개</div></div>'
    +'<div class="acts"><button class="sbtn" data-restoreBk="'+i+'">이 시점으로 복원</button></div></div>'
  ).join("") : '<div class="mgr-empty">아직 자동저장된 백업이 없습니다. (일주일마다 자동 생성)</div>';

  sheet.innerHTML=
    '<div class="sheet-head"><div class="head-actions"><button class="icon-btn" data-close aria-label="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'
    +'<div class="eyebrow" style="font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase">삭제함 · 백업</div><h2 style="margin-top:4px">삭제함 · 주간 백업</h2></div>'
    +'<div class="sheet-body">'
      +'<div class="mgr-sec"><div class="sec-h">삭제함 ('+TRASH.length+')</div>'+trashRows
        +(TRASH.length?'<div style="margin-top:12px"><button class="sbtn warn" id="emptyTrash">삭제함 비우기 (완전삭제)</button></div>':'')+'</div>'
      +'<div class="mgr-sec"><div class="sec-h">주간 자동저장 백업</div>'+bkRows+'</div>'
    +'</div>';
  sheet.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{ const id=b.dataset.restore; const i=TRASH.findIndex(t=>t.id===id); if(i>=0){ const it=TRASH.splice(i,1)[0]; delete it._deletedAt; DATA.push(it); saveData("복원했어요"); openTrash(); } });
  sheet.querySelectorAll("[data-purge]").forEach(b=>b.onclick=()=>{ if(confirm("완전히 삭제할까요? 되돌릴 수 없습니다.")){ TRASH=TRASH.filter(t=>t.id!==b.dataset.purge); saveData("완전 삭제했어요"); openTrash(); } });
  const et=sheet.querySelector("#emptyTrash"); if(et) et.onclick=()=>{ if(confirm("삭제함을 모두 비울까요? 되돌릴 수 없습니다.")){ TRASH=[]; saveData("삭제함을 비웠어요"); openTrash(); } };
  sheet.querySelectorAll("[data-restoreBk]").forEach(b=>b.onclick=()=>{ const bk=BACKUPS[+b.dataset.restoreBk]; if(bk && confirm(fmtDate(bk.ts)+" 시점으로 되돌릴까요? 현재 목록이 이 백업으로 교체됩니다.")){ DATA=normalize(bk.items); if(bk.config)CONFIG=Object.assign(CONFIG,bk.config); collectConfigFrom(DATA); saveData("백업 시점으로 복원했어요"); closeModal(); } });
  openModal(); sheet.scrollTop=0;
}

/* ============================================================
   설정 (분야 · 분류 · 장소 + 백업 복원)
   ============================================================ */
function openSettings(){
  const sheet=$("#sheet"); sheet.dataset.d="";
  sheet.innerHTML=

    +'<div class="eyebrow" style="font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase">설정</div><h2 style="margin-top:4px">선택지 관리</h2><p class="tag">편집 화면의 분야·분류·장소 드롭다운 목록입니다.</p></div>'
    +'<div class="edit-body" id="setBody">'
      +'<div class="ef"><label class="ef-label">분야 (탭)</label><textarea data-s="domains" rows="6">'+esc(CONFIG.domains.join("\n"))+'</textarea><div class="ef-hint">한 줄에 하나씩. 장비·주사제·실리프팅·수액·간호준비·피부관리 외 새 분야는 회색으로 표시됩니다.</div></div>'
      +'<div class="ef"><label class="ef-label">분류</label><textarea data-s="cats" rows="8">'+esc(CONFIG.cats.join("\n"))+'</textarea><div class="ef-hint">한 줄에 하나씩.</div></div>'
      +'<div class="ef"><label class="ef-label">장소</label><textarea data-s="rooms" rows="4">'+esc(CONFIG.rooms.join("\n"))+'</textarea><div class="ef-hint">한 줄에 하나씩.</div></div>'
      +'<div class="ef"><label class="ef-label">백업 복원</label><div class="mini-btns" style="margin-top:0"><button class="sbtn" id="importXlsx">엑셀 복원</button><button class="sbtn" id="importJson">JSON 복원</button></div><div class="ef-hint">백업 파일에 저장된 전체 항목과 설정으로 되돌립니다. 복원 전 현재 상태는 JSON으로 자동 백업됩니다.</div></div>'
      +'<p class="ef-hint">※ 이미 쓰이는 값을 목록에서 지워도, 그 값을 쓰던 항목은 그대로 유지됩니다.</p>'
    +'</div>'
    +'<div class="edit-actions"><button class="btn btn-cancel" type="button" data-cancel>취소</button><button class="btn btn-save" type="button" id="setSave">저장</button></div>';
  sheet.querySelectorAll("textarea[data-s]").forEach(ta=>{ autoGrow(ta); ta.oninput=()=>autoGrow(ta); });
  sheet.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=closeModal);
  sheet.querySelector("#importJson").onclick=()=>$("#jsonFile").click();
  sheet.querySelector("#importXlsx").onclick=()=>$("#xlsxFile").click();
  sheet.querySelector("#setSave").onclick=()=>{
    const body=sheet.querySelector("#setBody");
    const rd=k=>splitLines(body.querySelector('[data-s="'+k+'"]').value);
    const doms=rd("domains"); if(doms.length) CONFIG.domains=doms;
    CONFIG.cats=rd("cats"); CONFIG.rooms=rd("rooms");
    closeModal(); saveData("설정을 저장했어요");
  };
  openModal(); sheet.scrollTop=0;
}

/* ============================================================
   엑셀 / JSON 전체 백업 · 복원
   ============================================================ */
function exportExcel(){
  if(typeof XLSX==="undefined"){ toast("엑셀 모듈 로딩 중… 잠시 후 다시"); return; }
  const arrJson=a=>JSON.stringify(Array.isArray(a)?a:[]);
  const doseJson=d=>d?JSON.stringify(d):"";
  const itemRow=(x,status)=>({
    "구분":status,
    "ID":x.id||"",
    "분야":x.domain||"",
    "분류":x.cat||"",
    "이름":x.name||"",
    "장소":x.room||"",
    "태그":x.tag||"",
    "마취":x.anes||"",
    "시술시간":x.time||"",
    "사용기한":x.exp||"",
    "처방":x.rx?"O":"",
    "시행":x.active===false?"미시행":"시행",
    "효과_JSON":arrJson(x.effects),
    "모드_JSON":arrJson(x.modes),
    "준비물_JSON":arrJson(x.prep),
    "시술준비_JSON":arrJson(x.setting),
    "MIX":x.mix||"",
    "시술순서_JSON":arrJson(x.steps),
    "차팅_JSON":arrJson(x.charting),
    "시술후_JSON":arrJson(x.after),
    "특이사항_JSON":arrJson(x.notes),
    "용량표_JSON":doseJson(x.dose),
    "삭제시각":status==="삭제항목"?(x._deletedAt||""):""
  });
  const rows=DATA.map(x=>itemRow(x,"사용항목")).concat(TRASH.map(x=>itemRow(x,"삭제항목")));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:10},{wch:16},{wch:10},{wch:12},{wch:18},{wch:11},{wch:28},{wch:18},{wch:14},{wch:10},{wch:7},{wch:9},{wch:34},{wch:30},{wch:38},{wch:38},{wch:42},{wch:42},{wch:34},{wch:34},{wch:38},{wch:40},{wch:18}];

  const settingsRows=[
    {"항목":"백업버전","값":"2"},
    {"항목":"백업일시","값":new Date().toISOString()},
    {"항목":"APP_NAME","값":APP_NAME},
    {"항목":"CONFIG_JSON","값":JSON.stringify(CONFIG)},
    {"항목":"META_JSON","값":JSON.stringify(META)}
  ];
  const ws2=XLSX.utils.json_to_sheet(settingsRows);
  ws2["!cols"]=[{wch:18},{wch:80}];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"전체항목");
  XLSX.utils.book_append_sheet(wb,ws2,"설정");
  const fname=APP_NAME+"_전체백업_"+ymd()+".xlsx";
  XLSX.writeFile(wb, fname);
  const saved=cloudBackup({ type:"driveXlsx", name:fname, b64:XLSX.write(wb,{bookType:"xlsx",type:"base64"}) });
  toast(saved?"전체 항목 엑셀 저장 완료 — 다운로드 + 드라이브":"전체 항목을 엑셀로 백업했어요");
}
function ymd(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function exportJson(){
  const blob=new Blob([payload()],{type:"application/json"});
  const fname=APP_NAME+"_전체백업_"+ymd()+".json";
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  const saved=cloudBackup({ type:"driveJson", name:fname, content:payload() });
  toast(saved?"전체 항목 JSON 저장 완료 — 다운로드 + 드라이브":"전체 항목을 JSON으로 백업했어요");
}
$("#jsonFile").addEventListener("change",function(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const p=JSON.parse(r.result);
      const items=Array.isArray(p)?p:(p.items||[]);
      if(!items.length){ toast("복원할 항목이 없어요"); return; }
      if(!confirm("이 JSON 백업으로 전체를 복원할까요?\n\n현재 항목·삭제항목·설정이 백업 파일의 상태로 바뀝니다.")) return;
      autoBackupJson("복원전");
      DATA=normalize(items);
      TRASH=Array.isArray(p.trash)?normalize(p.trash):[];
      if(p.config) CONFIG=Object.assign(CONFIG,p.config);
      if(Array.isArray(p.backups)) BACKUPS=p.backups;
      if(p.meta) META=Object.assign(META,p.meta);
      collectConfigFrom(DATA.concat(TRASH));
      syncedOK=true; saveData("JSON 백업으로 전체 복원했어요"); closeModal();
    }catch(err){ toast("JSON 백업 파일을 읽을 수 없어요"); }
    e.target.value="";
  };
  r.readAsText(f);
});

/* ---------- 되돌리기용 자동 백업 (다운로드 + 드라이브) ---------- */
function autoBackupJson(label){
  try{
    const str=payload();
    const blob=new Blob([str],{type:"application/json"});
    const fname=APP_NAME+"_"+(label||"자동백업")+"_"+ymd()+".json";
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    cloudBackup({ type:"driveJson", name:fname, content:str });
  }catch(e){}
}

/* ---------- 엑셀 복원 ---------- */
function splitCell(v){
  return String(v==null?"":v).split(/\r?\n/).reduce((acc,s)=>{
    if(s.indexOf(" / ")>=0) acc.push.apply(acc, s.split(" / ")); else acc.push(s); return acc;
  },[]).map(s=>s.trim()).filter(Boolean);
}
$("#xlsxFile").addEventListener("change",function(e){
  const f=e.target.files[0]; if(!f)return;
  if(typeof XLSX==="undefined"){ toast("엑셀 모듈 로딩 중… 잠시 후 다시"); e.target.value=""; return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});
      const mainName=wb.SheetNames.includes("전체항목")?"전체항목":wb.SheetNames[0];
      const ws=wb.Sheets[mainName];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      if(!rows.length){ toast("복원할 항목이 없어요"); e.target.value=""; return; }
      if(!confirm("이 엑셀 백업으로 전체를 복원할까요?\n\n현재 항목·삭제항목·설정이 백업 파일의 상태로 바뀝니다.")){ e.target.value=""; return; }
      autoBackupJson("복원전");

      const parseArr=(row,jsonKey,legacyKey)=>{
        const raw=String(row[jsonKey]||"").trim();
        if(raw){ try{ const a=JSON.parse(raw); if(Array.isArray(a)) return a; }catch(err){} }
        return splitCell(row[legacyKey]||"");
      };
      const parseDose=row=>{
        const raw=String(row["용량표_JSON"]||"").trim();
        if(raw){ try{ const d=JSON.parse(raw); if(d&&typeof d==="object") return d; }catch(err){} }
        return null;
      };
      const rowToItem=row=>({
        id:String(row["ID"]||row["id"]||"").trim()||uid(),
        domain:String(row["분야"]||CONFIG.domains[0]||"장비").trim(),
        cat:String(row["분류"]||"").trim(),
        name:String(row["이름"]||"").trim(),
        room:String(row["장소"]||"").trim(),
        tag:String(row["태그"]||"").trim(),
        anes:String(row["마취"]||"").trim(),
        time:String(row["시술시간"]||row["시간"]||"").trim(),
        exp:String(row["사용기한"]||"").trim(),
        rx:/O|o|Y|y|예|처방|1|true/.test(String(row["처방"]||"")),
        active:!/미시행|중지|안함|false/.test(String(row["시행"]||"")),
        effects:parseArr(row,"효과_JSON","효과"),
        modes:parseArr(row,"모드_JSON","모드"),
        prep:parseArr(row,"준비물_JSON","준비물"),
        setting:parseArr(row,"시술준비_JSON","시술준비"),
        mix:String(row["MIX"]||"").trim(),
        steps:parseArr(row,"시술순서_JSON","시술순서"),
        charting:parseArr(row,"차팅_JSON","차팅"),
        after:parseArr(row,"시술후_JSON","시술후"),
        notes:parseArr(row,"특이사항_JSON","특이사항"),
        dose:parseDose(row)
      });

      const nextData=[], nextTrash=[];
      rows.forEach(row=>{
        if(!String(row["이름"]||"").trim()) return;
        const it=rowToItem(row);
        if(String(row["구분"]||"").trim()==="삭제항목"){
          const ts=Number(row["삭제시각"]||0); if(ts) it._deletedAt=ts;
          nextTrash.push(it);
        }else nextData.push(it);
      });
      if(!nextData.length){ toast("사용 항목을 찾지 못했어요"); e.target.value=""; return; }
      DATA=normalize(nextData);
      TRASH=normalize(nextTrash);

      if(wb.SheetNames.includes("설정")){
        const setRows=XLSX.utils.sheet_to_json(wb.Sheets["설정"],{defval:""});
        const map={}; setRows.forEach(x=>{ map[String(x["항목"]||"")]=x["값"]; });
        if(map.CONFIG_JSON){ try{ CONFIG=Object.assign(CONFIG,JSON.parse(map.CONFIG_JSON)); }catch(err){} }
        if(map.META_JSON){ try{ META=Object.assign(META,JSON.parse(map.META_JSON)); }catch(err){} }
      }
      collectConfigFrom(DATA.concat(TRASH));
      syncedOK=true; saveData("엑셀 백업으로 전체 복원했어요"); closeModal();
    }catch(err){ toast("엑셀 백업 파일을 읽을 수 없어요"); }
    e.target.value="";
  };
  r.readAsArrayBuffer(f);
});
