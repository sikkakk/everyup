<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위례 에브리업의원 · 재고관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F7F9; --surface:#FFFFFF; --ink:#1B2733; --ink-soft:#5A6B7B;
    --line:#E4E9ED; --line-soft:#EEF2F5;
    --primary:#0B7285; --primary-soft:#E3F1F3; --primary-ink:#075662;
    --danger:#E03131; --danger-soft:#FDECEC;
    --warn:#E8890C; --warn-soft:#FCF1E0;
    --ok:#2F9E44; --ok-soft:#EAF6EC;
    --shadow:0 1px 2px rgba(20,40,60,.04),0 4px 16px rgba(20,40,60,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
  }
  .wrap{max-width:1280px; margin:0 auto; padding:20px 18px 80px}

  header.top{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:6px 2px 14px}
  header.top h1{font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0}
  header.top .sub{color:var(--ink-soft); font-size:13px; font-weight:500}
  header.top .asof{margin-left:auto; color:var(--ink-soft); font-size:12.5px}
  .syncpill{font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px}
  .syncpill.off{background:var(--line-soft); color:var(--ink-soft)}
  .syncpill.ok{background:var(--ok-soft); color:var(--ok)}
  .syncpill.saving{background:var(--warn-soft); color:var(--warn)}
  .syncpill.err{background:var(--danger-soft); color:var(--danger)}
  .refreshbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:8px; width:28px; height:24px; font-size:14px; cursor:pointer; line-height:1}
  .refreshbtn:hover{background:#F7F9FA; color:var(--primary)}

  /* view toggle */
  .viewtabs{display:inline-flex; gap:4px; background:var(--surface); border:1px solid var(--line);
        border-radius:11px; padding:3px; box-shadow:var(--shadow); margin-bottom:14px}
  .viewtabs button{border:0; background:transparent; padding:8px 16px; border-radius:8px; cursor:pointer;
        font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft)}
  .viewtabs button.on{background:var(--primary-ink); color:#fff}

  .demo-banner{background:#FFF8E6; border:1px solid #F3E2B0; color:#8A6D1E; font-size:12.5px; font-weight:600;
        border-radius:11px; padding:9px 13px; margin-bottom:14px; display:flex; gap:8px; align-items:flex-start}

  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
  .card .lab{font-size:12.5px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:6px}
  .card .num{font-size:26px; font-weight:800; letter-spacing:-.02em; margin-top:6px; font-variant-numeric:tabular-nums}
  .card .num small{font-size:13px; font-weight:600; color:var(--ink-soft); margin-left:3px}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block}
  .dot.d{background:var(--danger)} .dot.w{background:var(--warn)} .dot.p{background:var(--primary)}
  .card.alert .num{color:var(--danger)}
  .card.warnc .num{color:var(--warn)}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
  .segs{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:3px; box-shadow:var(--shadow)}
  .segs button{border:0; background:transparent; padding:7px 13px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-soft)}
  .segs button.on{background:var(--primary); color:#fff}
  .segs button .cnt{opacity:.7; font-weight:600; margin-left:4px; font-size:12px}
  .segs button.on .cnt{opacity:.85}
  .search{flex:1; min-width:170px; position:relative}
  .search input{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:10px 12px 10px 36px; font-family:inherit; font-size:14px; box-shadow:var(--shadow); color:var(--ink)}
  .search input:focus{outline:2px solid var(--primary-soft); border-color:var(--primary)}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-soft)}
  .btn{border:0; border-radius:11px; padding:10px 15px; font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer; box-shadow:var(--shadow); white-space:nowrap}
  .btn.primary{background:var(--primary); color:#fff}
  .btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
  .btn.del{background:var(--surface); color:var(--danger); border:1px solid #F5D2D2}
  .btn:active{transform:translateY(1px)}

  .tablecard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .scroller{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:1140px}
  #tbl.fixed{table-layout:fixed; min-width:0}
  #tbl.fixed td,#tbl.fixed th{overflow:hidden}
  #tbl.fixed .name,#tbl.fixed .cat,#tbl.fixed .spec{white-space:normal; overflow-wrap:anywhere}
  #tbl.fixed tbody td{vertical-align:top}
  thead th{position:relative}
  .rsz{position:absolute; top:0; right:-4px; width:9px; height:100%; cursor:col-resize; z-index:3}
  .rsz:hover{background:linear-gradient(90deg,transparent 40%,var(--primary) 40%,var(--primary) 60%,transparent 60%)}
  body.resizing{cursor:col-resize; user-select:none}
  .selcol input,.selcell input{width:15px; height:15px; vertical-align:middle; cursor:pointer; accent-color:var(--primary)}
  .selcell{white-space:nowrap}
  .grip{display:inline-block; margin-left:5px; color:#AEB9C3; font-size:13px; cursor:grab; vertical-align:middle; letter-spacing:-2px}
  .grip:active{cursor:grabbing}
  tr.drop-target td{box-shadow:inset 0 2px 0 0 var(--primary)}
  #selbar{display:none; align-items:center; gap:8px; flex-wrap:wrap; background:var(--primary-ink); color:#fff; border-radius:12px; padding:9px 13px; margin-bottom:12px; box-shadow:var(--shadow)}
  #selbar .selcount{font-weight:800; font-size:13px}
  #selbar .hintlabel{font-size:12.5px; opacity:.8; margin-left:2px}
  #selbar .spacer{flex:1}
  #selbar button{border:0; background:rgba(255,255,255,.16); color:#fff; border-radius:8px; padding:6px 11px; font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer}
  #selbar button:hover{background:rgba(255,255,255,.30)}
  thead th{font-size:12px; font-weight:700; color:var(--ink-soft); text-align:left; padding:11px 12px; background:var(--line-soft); border-bottom:1px solid var(--line); white-space:nowrap}
  th.num,td.num{text-align:right; font-variant-numeric:tabular-nums}
  tbody td{padding:3px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; line-height:1.3}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FBFCFD}
  tr.row-danger{background:var(--danger-soft)} tr.row-danger:hover{background:#FCE3E3}
  tr.row-warn{background:var(--warn-soft)} tr.row-warn:hover{background:#FBEBD6}
  .name{font-weight:700; letter-spacing:-.01em; white-space:nowrap}
  .muted{color:var(--ink-soft)}
  .spec{color:var(--ink-soft); font-size:12px; white-space:nowrap}
  .tiny{font-size:11px !important}
  .qty{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums}
  .qty.zero{color:var(--danger)}
  .qty .u{font-size:12px; font-weight:600; color:var(--ink-soft); margin-left:3px}
  .minq{color:var(--ink-soft); font-size:12.5px}
  .chkdate{font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; margin-top:0; text-align:right}
  .memo{max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink-soft); font-size:12.5px}

  .chip{display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap}
  .chip.ok{background:var(--ok-soft); color:var(--ok)}
  .chip.low{background:var(--warn-soft); color:var(--warn)}
  .chip.out{background:var(--danger-soft); color:var(--danger)}
  .depttag{display:inline-block; padding:2px 8px; border-radius:7px; font-size:11.5px; font-weight:700; background:var(--primary-soft); color:var(--primary-ink)}
  .cat{font-size:11.5px; color:var(--ink-soft); margin-top:0; white-space:nowrap}

  .exp{font-variant-numeric:tabular-nums; font-size:12.5px}
  .exp .dd{display:inline-block; margin-left:5px; padding:1px 6px; border-radius:6px; font-size:11px; font-weight:800}
  .exp.lv3{color:var(--danger); font-weight:700}
  .exp.lv3 .dd{background:var(--danger-soft)}
  .exp.lv6{color:var(--warn); font-weight:700}
  .exp.lv6 .dd{background:var(--warn-soft)}

  .actions{display:flex; gap:6px; justify-content:flex-end}
  .mini{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 9px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink); white-space:nowrap}
  .mini.in{color:var(--ok); border-color:#CDEBD3}
  .mini.chk{color:var(--primary-ink); border-color:#C9E6EA}
  .mini.edit{color:var(--ink-soft)}
  .mini:hover{background:#F7F9FA}

  .empty{padding:48px 20px; text-align:center; color:var(--ink-soft)}
  .empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px}

  .overlay{position:fixed; inset:0; background:rgba(20,35,50,.42); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; backdrop-filter:blur(2px)}
  .overlay.show{display:flex}
  .modal{background:var(--surface); border-radius:16px; width:100%; max-width:480px; box-shadow:0 20px 60px rgba(15,30,45,.28); max-height:92vh; overflow-y:auto}
  .modal h3{margin:0; padding:18px 20px 4px; font-size:17px; font-weight:800; letter-spacing:-.01em}
  .modal .msub{padding:0 20px; color:var(--ink-soft); font-size:13px}
  .modal .body{padding:14px 20px 4px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px}
  .field input,.field select{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface)}
  .field input:focus,.field select:focus{outline:2px solid var(--primary-soft); border-color:var(--primary)}
  .field .ro{background:var(--line-soft); border-radius:10px; padding:10px 12px; font-weight:800; font-size:16px; color:var(--ink)}
  .field .hint{font-size:11.5px; color:var(--ink-soft); font-weight:500; margin-top:4px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stepper{display:flex; align-items:stretch; gap:8px}
  .stepper button{width:44px; border:1px solid var(--line); background:#F7F9FA; border-radius:10px; font-size:20px; font-weight:700; cursor:pointer; color:var(--ink)}
  .stepper input{text-align:center; font-size:18px; font-weight:800}
  .preview{background:var(--line-soft); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--ink-soft); margin-top:2px}
  .preview b{color:var(--ink); font-weight:800; font-size:15px}
  .modal .foot{display:flex; gap:10px; padding:14px 20px 20px}
  .modal .foot .btn{flex:1; justify-content:center; text-align:center}

  @media (max-width:720px){
    .cards{grid-template-columns:1fr 1fr}
    header.top .asof{width:100%; margin-left:0}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>재고관리</h1>
    <span class="sub">위례 에브리업의원 · 통합 재고</span>
    <span class="asof" id="asof"></span>
    <span class="syncpill off" id="syncpill">미리보기</span>
    <button class="refreshbtn" id="refreshBtn" onclick="reloadNow()" title="서버에서 최신 내용 불러오기" style="display:none">↻</button>
  </header>

  <div class="viewtabs" id="viewtabs">
    <button data-v="stock" class="on" onclick="setView('stock')">재고 현황</button>
    <button data-v="history" onclick="setView('history')">입고 내역</button>
    <button data-v="trash" onclick="setView('trash')">삭제된 항목</button>
  </div>

  <div class="demo-banner" id="demoBanner">
    <span>◆</span>
    <span>지금은 <b>업로드하신 실제 재고(215개)를 불러온 확인용 화면</b>이에요. 입고·실사조정·수정을 직접 눌러 테스트하실 수 있습니다. (새로고침하면 초기화됩니다. 실장·코디와 함께 쓰는 구글시트 연결은 다음 단계에 붙입니다.)</span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="toolbar">
    <div class="segs" id="segs"></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="품목명 · 회사 검색">
    </div>
    <button class="btn ghost" id="newBtn" onclick="openForm('new')">+ 신규품목</button>
    <button class="btn primary" id="xlsxBtn" onclick="exportXlsx()">엑셀 다운로드</button>
  </div>

  <div id="selbar">
    <span class="selcount">0개 선택</span>
    <span class="hintlabel">선택한 품목 순서 이동:</span>
    <button onclick="moveSelected('top')">맨 위로</button>
    <button onclick="moveSelected('up')">▲ 위로</button>
    <button onclick="moveSelected('down')">▼ 아래로</button>
    <button onclick="moveSelected('bottom')">맨 아래로</button>
    <span class="spacer"></span>
    <button onclick="clearSel()">선택 해제</button>
  </div>

  <div class="tablecard">
    <div class="scroller"><table id="tbl"><colgroup id="cg"></colgroup><thead id="thead"></thead><tbody id="rows"></tbody></table></div>
    <div class="empty" id="empty" style="display:none"><b>표시할 내용이 없어요</b>검색어나 부서 필터를 바꿔보세요.</div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<datalist id="dl-cat"></datalist>
<datalist id="dl-company"></datalist>
<datalist id="dl-unit"></datalist>
<datalist id="dl-loc"></datalist>
<datalist id="dl-src"></datalist>

<script>
/* ===== 규칙 =====
   현재수량 = 기준수량(baseQty) + Σ입고수량 (기준시각 이후 기록만)
   실사조정 = 실제 센 값으로 기준을 다시 맞춤 (기준시각 갱신)
   출고 기능 없음 → 재고 감소는 실사조정으로만
================= */
const DEPTS = ["장비재료","간호","피부","비품"];
// 재고 표 열 정의 (tbody 셀 순서와 반드시 일치)
const STOCK_COLS = [
  {label:"상태", w:60, align:"left"},
  {label:"부서 / 분류", w:118, align:"left"},
  {label:"품목", w:180, align:"left"},
  {label:"규격", w:88, align:"left"},
  {label:"현재수량", w:100, align:"right"},
  {label:"최소재고", w:72, align:"right"},
  {label:"사용기한", w:120, align:"left"},
  {label:"보관위치", w:110, align:"left"},
  {label:"구매처", w:88, align:"left"},
  {label:"메모", w:120, align:"left"},
  {label:"관리", w:150, align:"right"},
];
let stockW = STOCK_COLS.map(c=>c.w);
const CHK_W = 60;                 // 맨 왼쪽 체크박스+드래그 칸 (고정, 조절 안함)
let stockList = [];               // 현재 화면에 보이는 품목(표시 순서)
let selected = new Set();         // 선택된 품목 id
let dragFrom = -1;                // 드래그 시작 위치
// 열 너비 기억(배포 주소에서 동작; 미리보기에서는 무시)
function saveW(){ try{ localStorage.setItem("everyup_stockW", JSON.stringify(stockW)); }catch(e){} }
function loadW(){ try{ const v=JSON.parse(localStorage.getItem("everyup_stockW")); if(Array.isArray(v)&&v.length===STOCK_COLS.length) stockW=v.map(Number); }catch(e){} }
let items = seed();
let filterDept = "전체";
let query = "";
let view = "stock";

function seed(){

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function qtyOf(it){ let q=Number(it.baseQty)||0; for(const g of (it.logs||[])){ if(g.ts>it.baseTs) q+=(Number(g.amt)||0); } return q; }
function stockState(it){ const q=qtyOf(it); if(q<=0) return "out"; if(it.min>0 && q<=it.min) return "low"; return "ok"; }
function today(){ const d=new Date(); return `${String(d.getFullYear()).slice(2)}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function toDateInput(yy){ if(!yy) return ""; const m=yy.split("-"); if(m.length!==3) return ""; return `20${m[0].padStart(2,"0")}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; }
function fromDateInput(v){ if(!v) return ""; const m=v.split("-"); if(m.length!==3) return ""; return `${m[0].slice(2)}-${m[1]}-${m[2]}`; }
// 사용기한 → {days,label,lv}  lv: 3(3개월내·만료 빨강) / 6(6개월내 주황) / 0
function expInfo(exp){
  if(!exp) return null;
  const m = exp.split("-").map(Number); if(m.length!==3) return null;
  const d = new Date(2000+m[0], m[1]-1, m[2]);
  const now = new Date(); now.setHours(0,0,0,0);
  const days = Math.round((d-now)/86400000);
  const label = `${String(m[0]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  let lv=0; if(days<0||days<=90) lv=3; else if(days<=180) lv=6;
  return {days,label,lv};
}
function refreshDatalists(){
  const map={"dl-cat":"cat","dl-company":"company","dl-unit":"unit","dl-loc":"loc","dl-src":"src"};
  for(const [id,f] of Object.entries(map)){
    const vals=[...new Set(items.map(i=>i[f]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
    document.getElementById(id).innerHTML = vals.map(v=>`<option value="${esc(v)}">`).join("");
  }
}

/* ---- 렌더 ---- */
function visibleItems(){
  return items.filter(it=>{
    if(it.deleted) return false;
    if(filterDept!=="전체" && it.dept!==filterDept) return false;
    if(query){ if(!(it.name+" "+(it.company||"")).toLowerCase().includes(query.toLowerCase())) return false; }
    return true;
  });
}
function setDept(d){ filterDept=d; selected.clear(); render(); }
function setView(v){ view=v; selected.clear(); render(); }
document.getElementById("q").addEventListener("input", e=>{ query=e.target.value; selected.clear(); render(); });

function render(){
  refreshDatalists();
  const active = items.filter(i=>!i.deleted);
  const scope = filterDept==="전체" ? active : active.filter(i=>i.dept===filterDept);
  const lowCnt = scope.filter(i=>stockState(i)!=="ok").length;
  let soon=0, expd=0;
  scope.forEach(i=>{ const e=expInfo(i.exp); if(e){ if(e.days<0) expd++; else if(e.days<=180) soon++; } });
  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="lab"><span class="dot p"></span>전체 품목</div><div class="num">${scope.length}<small>개</small></div></div>
    <div class="card ${lowCnt?'alert':''}"><div class="lab"><span class="dot d"></span>재고 부족·품절</div><div class="num">${lowCnt}<small>건</small></div></div>
    <div class="card ${soon?'warnc':''}"><div class="lab"><span class="dot w"></span>사용기한 임박 (6개월)</div><div class="num">${soon}<small>건</small></div></div>
    <div class="card ${expd?'alert':''}"><div class="lab"><span class="dot d"></span>사용기한 만료</div><div class="num">${expd}<small>건</small></div></div>`;

  const seg = [...DEPTS,"전체"];
  document.getElementById("segs").innerHTML = seg.map(d=>{
    const c = d==="전체"? active.length : active.filter(i=>i.dept===d).length;
    return `<button class="${filterDept===d?'on':''}" onclick="setDept('${d}')">${d}<span class="cnt">${c}</span></button>`;
  }).join("");

  const delCnt = items.filter(i=>i.deleted).length;
  document.querySelectorAll(".viewtabs button").forEach(b=>{
    b.classList.toggle("on", b.dataset.v===view);
    if(b.dataset.v==="trash") b.textContent = delCnt? `삭제된 항목 (${delCnt})` : "삭제된 항목";
  });
  document.getElementById("newBtn").style.display = view==="stock" ? "" : "none";
  const xb=document.getElementById("xlsxBtn");
  xb.style.display = view==="stock" ? "" : "none";
  xb.textContent = `엑셀 다운로드 (${filterDept})`;

  const tbl=document.getElementById("tbl");
  if(view==="stock"){ tbl.classList.add("fixed"); }
  else{ tbl.classList.remove("fixed"); tbl.style.width=""; document.getElementById("cg").innerHTML=""; }

  if(view==="stock") renderStock();
  else if(view==="history") renderHistory();
  else renderTrash();

  const sb=document.getElementById("selbar");
  if(view==="stock" && selected.size){ sb.style.display="flex"; sb.querySelector(".selcount").textContent=`${selected.size}개 선택`; }
  else sb.style.display="none";
}

function renderStock(){
  const list = visibleItems();
  stockList = list;
  const allChecked = list.length && list.every(it=>selected.has(it.id));
  // colgroup(열 너비) + 표 전체 너비 (맨 왼쪽 체크칸 포함)
  const total = CHK_W + stockW.reduce((a,b)=>a+b,0);
  document.getElementById("cg").innerHTML = `<col style="width:${CHK_W}px">` + stockW.map(w=>`<col style="width:${w}px">`).join("");
  document.getElementById("tbl").style.width = total+"px";
  document.getElementById("thead").innerHTML = "<tr>" +
    `<th class="selcol"><input type="checkbox" ${allChecked?"checked":""} onchange="toggleAll(this.checked)" title="전체 선택"></th>` +
    STOCK_COLS.map((c,i)=>
      `<th class="${c.align==='right'?'num':''}">${c.label}<span class="rsz" onmousedown="startResize(event,${i})" ontouchstart="startResize(event,${i})"></span></th>`
    ).join("") + "</tr>";
  const tb=document.getElementById("rows"), emp=document.getElementById("empty");
  if(!list.length){ tb.innerHTML=""; emp.querySelector("b").textContent="표시할 내용이 없어요"; emp.style.display="block"; return; }
  emp.style.display="none";
  tb.innerHTML = list.map((it,idx)=>{
    const q=qtyOf(it), st=stockState(it);
    const chip = st==="out"?`<span class="chip out">품절</span>`:st==="low"?`<span class="chip low">부족</span>`:`<span class="chip ok">정상</span>`;
    const rowcls = st==="out"?"row-danger":st==="low"?"row-warn":"";
    const e=expInfo(it.exp);
    let expHtml=`<span class="muted">-</span>`;
    if(e){
      if(e.days<0) expHtml=`<span class="exp lv3">${e.label}<span class="dd">만료</span></span>`;
      else if(e.lv===3) expHtml=`<span class="exp lv3">${e.label}<span class="dd">D-${e.days}</span></span>`;
      else if(e.lv===6) expHtml=`<span class="exp lv6">${e.label}<span class="dd">D-${e.days}</span></span>`;
      else expHtml=`<span class="exp">${e.label}</span>`;
    }
    return `<tr class="${rowcls}" data-vi="${idx}" ondragover="dragOver(event,${idx})" ondrop="dragDrop(event,${idx})" ondragend="dragEnd()">
      <td class="selcell"><input type="checkbox" ${selected.has(it.id)?"checked":""} onchange="toggleOne(${it.id},this.checked)"><span class="grip" draggable="true" ondragstart="dragStart(event,${idx})" title="드래그로 순서 이동">⠿</span></td>
      <td>${chip}</td>
      <td><span class="depttag">${esc(it.dept)}</span><div class="cat">${esc(it.cat||"")}</div></td>
      <td><div class="name">${esc(it.name)}</div><div class="spec">${esc(it.company||"")}</div></td>
      <td class="spec">${esc(it.spec||"-")}</td>
      <td class="num"><span class="qty ${q<=0?'zero':''}">${q}<span class="u">${esc(it.unit||"")}</span></span>${it.chk?`<div class="chkdate">${esc(it.chk)}</div>`:""}</td>
      <td class="num minq">${it.min>0?it.min:"-"}</td>
      <td>${expHtml}</td>
      <td class="spec tiny">${esc(it.loc||"-")}</td>
      <td class="spec tiny">${esc(it.src||"-")}</td>
      <td><div class="memo" title="${esc(it.memo||"")}">${esc(it.memo||"")||'<span class="muted">-</span>'}</div></td>
      <td><div class="actions">
        <button class="mini in" onclick="openIn(${it.id})">입고</button>
        <button class="mini chk" onclick="openAudit(${it.id})">실사</button>
        <button class="mini edit" onclick="openForm('edit',${it.id})">수정</button>
      </div></td></tr>`;
  }).join("");
}

function renderHistory(){
  document.getElementById("thead").innerHTML = `<tr>
    <th>입고일</th><th>부서</th><th>품목</th><th>규격</th>
    <th class="num">입고수량</th><th>구매처</th><th>메모</th><th style="text-align:right">관리</th></tr>`;
  let recs=[];
  items.forEach(it=>{
    if(it.deleted) return;
    if(filterDept!=="전체" && it.dept!==filterDept) return;
    if(query && !(it.name+" "+(it.company||"")).toLowerCase().includes(query.toLowerCase())) return;
    (it.logs||[]).forEach(g=>recs.push({itemId:it.id, date:g.date||"", ts:g.ts, dept:it.dept, name:it.name, company:it.company, spec:it.spec, unit:it.unit, amt:g.amt, src:g.src||"", memo:g.memo||""}));
  });
  recs.sort((a,b)=> (b.date.localeCompare(a.date)) || (b.ts-a.ts));
  const tb=document.getElementById("rows"), emp=document.getElementById("empty");
  if(!recs.length){ tb.innerHTML=""; emp.querySelector("b").textContent="입고 기록이 아직 없어요"; emp.style.display="block"; return; }
  emp.style.display="none";
  tb.innerHTML = recs.map(r=>`<tr>
    <td class="spec" style="font-variant-numeric:tabular-nums">${esc(r.date||"-")}</td>
    <td><span class="depttag">${esc(r.dept)}</span></td>
    <td><div class="name">${esc(r.name)}</div><div class="spec">${esc(r.company||"")}</div></td>
    <td class="spec">${esc(r.spec||"-")}</td>
    <td class="num"><span class="qty">+${r.amt}<span class="u">${esc(r.unit||"")}</span></span></td>
    <td class="spec">${esc(r.src||"-")}</td>
    <td><div class="memo" title="${esc(r.memo)}">${esc(r.memo)||'<span class="muted">-</span>'}</div></td>
    <td><div class="actions"><button class="mini edit" onclick="openLogEdit(${r.itemId},${r.ts})">수정</button></div></td></tr>`).join("");
}
/* ---- 입고 기록 수정/삭제 ---- */
function openLogEdit(itemId, ts){
  const it=find(itemId); if(!it) return;
  const g=(it.logs||[]).find(x=>x.ts===ts); if(!g) return;
  modal.innerHTML=`
    <h3>입고 기록 수정</h3>
    <div class="msub">${esc(it.name)} · ${esc(it.company||"")}</div>
    <div class="body">
      <div class="field"><label>입고일</label><input id="le_date" type="date" value="${toDateInput(g.date||"")}"></div>
      <div class="field"><label>입고 수량 (${esc(it.unit||"개")})</label><input id="le_amt" type="number" min="1" value="${Number(g.amt)||1}" inputmode="numeric"></div>
      <div class="field"><label>구매처</label><input id="le_src" list="dl-src" value="${esc(g.src||"")}"></div>
      <div class="field"><label>메모</label><input id="le_memo" value="${esc(g.memo||"")}"></div>
      <div class="preview">수량을 고치면 현재수량도 함께 조정됩니다.</div>
    </div>
    <div class="foot"><button class="btn del" onclick="deleteLog(${itemId},${ts})">삭제</button><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveLogEdit(${itemId},${ts})">저장</button></div>`;
  overlay.classList.add("show");
}
function saveLogEdit(itemId, ts){
  const it=find(itemId); const g=(it.logs||[]).find(x=>x.ts===ts); if(!g){ closeModal(); return; }
  g.amt=Math.max(1,parseInt(document.getElementById("le_amt").value||"1"));
  g.date=fromDateInput(document.getElementById("le_date").value)||g.date;
  g.src=document.getElementById("le_src").value.trim();
  g.memo=document.getElementById("le_memo").value.trim();
  closeModal(); saveItem(it);
}
function deleteLog(itemId, ts){
  const it=find(itemId); if(!it) return;
  if(!confirm("이 입고 기록을 삭제할까요? 현재수량에서도 빠집니다.")) return;
  it.logs=(it.logs||[]).filter(x=>x.ts!==ts);
  closeModal(); saveItem(it);
}


function renderTrash(){
  document.getElementById("thead").innerHTML = `<tr>
    <th>부서 / 분류</th><th>품목</th><th>규격</th>
    <th class="num">삭제 당시 수량</th><th>사용기한</th><th>보관위치</th><th style="text-align:right">복원</th></tr>`;
  const list = items.filter(it=>{
    if(!it.deleted) return false;
    if(filterDept!=="전체" && it.dept!==filterDept) return false;
    if(query && !(it.name+" "+(it.company||"")).toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });
  const tb=document.getElementById("rows"), emp=document.getElementById("empty");
  if(!list.length){ tb.innerHTML=""; emp.querySelector("b").textContent="삭제된 항목이 없어요"; emp.style.display="block"; return; }
  emp.style.display="none";
  tb.innerHTML = list.map(it=>{
    const q=qtyOf(it); const e=expInfo(it.exp);
    const expHtml = e ? `<span class="exp">${e.label}</span>` : `<span class="muted">-</span>`;
    return `<tr>
      <td><span class="depttag">${esc(it.dept)}</span><div class="cat">${esc(it.cat||"")}</div></td>
      <td><div class="name">${esc(it.name)}</div><div class="spec">${esc(it.company||"")}</div></td>
      <td class="spec">${esc(it.spec||"-")}</td>
      <td class="num"><span class="qty">${q}<span class="u">${esc(it.unit||"")}</span></span></td>
      <td>${expHtml}</td>
      <td class="spec tiny">${esc(it.loc||"-")}</td>
      <td><div class="actions"><button class="mini chk" onclick="restoreItem(${it.id})">복원</button></div></td></tr>`;
  }).join("");
}

/* ---- 모달 공통 ---- */
const overlay=document.getElementById("overlay"), modal=document.getElementById("modal");
function closeModal(){ overlay.classList.remove("show"); modal.innerHTML=""; }
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
function find(id){ return items.find(x=>x.id===id); }

/* ---- 입고 ---- */
function openIn(id){
  const it=find(id), q=qtyOf(it);
  modal.innerHTML=`
    <h3>입고 기록</h3>
    <div class="msub">${esc(it.name)} · ${esc(it.company||"")} ${it.spec?("· "+esc(it.spec)):""}</div>
    <div class="body">
      <div class="field"><label>입고일</label><input id="in_date" type="date" value="${toDateInput(today())}"><div class="hint">기본은 오늘이에요. 다른 날로 바꿀 수 있어요.</div></div>
      <div class="field"><label>입고 수량 (${esc(it.unit||"개")})</label>
        <div class="stepper"><button type="button" onclick="bump(-1)">−</button><input id="amt" type="number" min="1" value="1" inputmode="numeric"><button type="button" onclick="bump(1)">+</button></div>
      </div>
      <div class="field"><label>구매처 (선택)</label><input id="in_src" list="dl-src" value="${esc(it.src||"")}" placeholder="예: 약이오, 영업사원"></div>
      <div class="field"><label>메모 (선택)</label><input id="in_memo" placeholder="예: 데모, 이벤트 물량"></div>
      <div class="preview">현재 <b>${q}</b> ${esc(it.unit||"")} → 입고 후 <b id="pv">${q+1}</b> ${esc(it.unit||"")}</div>
    </div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="doIn(${id})">입고 저장</button></div>`;
  const amt=document.getElementById("amt");
  amt.addEventListener("input",()=>{ const n=Math.max(1,parseInt(amt.value||"1")); document.getElementById("pv").textContent=q+n; });
  overlay.classList.add("show"); amt.focus(); amt.select();
}
function bump(d){ const a=document.getElementById("amt"); a.value=Math.max(1,(parseInt(a.value||"1")+d)); a.dispatchEvent(new Event("input")); }
function doIn(id){
  const it=find(id);
  const n=Math.max(1,parseInt(document.getElementById("amt").value||"1"));
  const date=fromDateInput(document.getElementById("in_date").value)||today();
  const src=document.getElementById("in_src").value.trim();
  const memo=document.getElementById("in_memo").value.trim();
  it.logs.push({ts:Date.now(), amt:n, date, src, memo});
  if(src) it.src=src; it.inDate=date;
  if(!it.chk || date>it.chk) it.chk=date;
  closeModal(); saveItem(it);
}

/* ---- 실사 ---- */
function openAudit(id){
  const it=find(id), q=qtyOf(it);
  modal.innerHTML=`
    <h3>실사 조정</h3>
    <div class="msub">${esc(it.name)} · 실제로 센 수량으로 맞춥니다</div>
    <div class="body">
      <div class="field"><label>실제 재고 수량 (${esc(it.unit||"개")})</label><input id="real" type="number" min="0" value="${q}" inputmode="numeric"></div>
      <div class="preview">현재 계산값 <b>${q}</b> → 실사값으로 기준을 다시 맞춥니다. 이후 입고는 여기서부터 자동 계산돼요.</div>
    </div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="doAudit(${id})">실사값 저장</button></div>`;
  overlay.classList.add("show");
  const r=document.getElementById("real"); r.focus(); r.select();
}
function doAudit(id){
  const it=find(id); const v=Math.max(0,parseInt(document.getElementById("real").value||"0"));
  it.baseQty=v; it.baseTs=Date.now(); it.logs=[]; it.chk=today(); closeModal(); saveItem(it);
}

/* ---- 신규 / 수정 (수량은 신규에서만 입력, 수정에서는 못 바꿈) ---- */
function openForm(mode, id){
  const it = mode==="edit" ? find(id) : {dept:filterDept!=="전체"?filterDept:DEPTS[0], cat:"",company:"",name:"",spec:"",unit:"",baseQty:0,min:0,exp:"",loc:"",src:"",memo:""};
  const isEdit = mode==="edit";
  const qtyBlock = isEdit
    ? `<div class="field"><label>현재수량</label><div class="ro">${qtyOf(it)} ${esc(it.unit||"")}</div><div class="hint">수량은 여기서 못 바꿔요. [입고]로 올리고 [실사]로 맞춥니다.</div></div>`

    <div class="msub">${isEdit?esc(it.name):"새 품목을 재고에 등록합니다"}</div>
    <div class="body">
      <div class="grid2">
        <div class="field"><label>부서</label><select id="f_dept">${DEPTS.map(d=>`<option ${d===it.dept?"selected":""}>${d}</option>`).join("")}</select></div>
        <div class="field"><label>분류</label><input id="f_cat" list="dl-cat" value="${esc(it.cat)}" placeholder="예: 02 스킨부스터"></div>
      </div>
      <div class="field"><label>품목명</label><input id="f_name" value="${esc(it.name)}" placeholder="품목명"></div>
      <div class="grid2">
        <div class="field"><label>회사(제조사)</label><input id="f_company" list="dl-company" value="${esc(it.company)}" placeholder="제조사"></div>
        <div class="field"><label>규격</label><input id="f_spec" value="${esc(it.spec)}" placeholder="예: 1.0mL"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>단위</label><input id="f_unit" list="dl-unit" value="${esc(it.unit)}" placeholder="개 / 박스 / 바이알"></div>
        ${qtyBlock}
      </div>
      <div class="grid2">
        <div class="field"><label>최소재고</label><input id="f_min" type="number" min="0" value="${it.min||0}" inputmode="numeric"></div>
        <div class="field"><label>사용기한</label><input id="f_exp" type="date" value="${toDateInput(it.exp)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>보관위치</label><input id="f_loc" list="dl-loc" value="${esc(it.loc)}" placeholder="예: 시술실 서랍"></div>
        <div class="field"><label>구매처</label><input id="f_src" list="dl-src" value="${esc(it.src)}" placeholder="예: 약이오"></div>
      </div>
      <div class="field"><label>메모</label><input id="f_memo" value="${esc(it.memo)}" placeholder="비고"></div>
    </div>
    <div class="foot">${isEdit?`<button class="btn del" onclick="doDelete(${id})">삭제</button>`:""}<button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="${isEdit?`doEdit(${id})`:"doNew()"}">${isEdit?"저장":"추가"}</button></div>`;
  overlay.classList.add("show");
  document.getElementById("f_name").focus();
}
function readForm(){
  const g=id=>document.getElementById(id).value.trim();
  return {dept:g("f_dept"),cat:g("f_cat"),company:g("f_company"),name:g("f_name"),spec:g("f_spec"),
    unit:g("f_unit")||"개",min:parseInt(g("f_min")||"0"),exp:fromDateInput(document.getElementById("f_exp").value),
    loc:g("f_loc"),src:g("f_src"),memo:g("f_memo")};
}
function doNew(){
  const f=readForm(); if(!f.name){ document.getElementById("f_name").focus(); return; }
  const id=Math.max(0,...items.map(i=>i.id))+1;
  const qty=parseInt(document.getElementById("f_qty").value||"0");
  const it={id,...f,baseQty:qty,baseTs:Date.now(),logs:[],inDate:"",chk:today()};
  items.push(it);
  filterDept=f.dept; query=""; document.getElementById("q").value=""; view="stock";
  closeModal(); saveItem(it);
}
function doEdit(id){
  const it=find(id); const f=readForm(); if(!f.name){ document.getElementById("f_name").focus(); return; }
  Object.assign(it, f); // 수량 관련(baseQty/baseTs/logs)은 건드리지 않음
  closeModal(); saveItem(it);
}
function doDelete(id){
  const it=find(id); it.deleted=true;   // 영구삭제 아님 → '삭제된 항목' 탭으로 이동
  closeModal(); saveItem(it);
}
function restoreItem(id){
  const it=find(id); it.deleted=false;
  saveItem(it);
}

/* ---- 선택 & 순서 이동 ---- */
function toggleAll(ch){ stockList.forEach(it=> ch? selected.add(it.id) : selected.delete(it.id)); render(); }
function toggleOne(id,ch){ ch? selected.add(id) : selected.delete(id); render(); }
function clearSel(){ selected.clear(); render(); }
// 보이는 목록의 새 순서를 전체 items에 반영 (안 보이는 항목 위치는 그대로)
function reorderMaster(newVisible){
  const visSet=new Set(stockList.map(x=>x.id));
  const q=newVisible.slice();
  for(let k=0;k<items.length;k++){ if(visSet.has(items[k].id)) items[k]=q.shift(); }
}
function moveSelected(where){
  if(!selected.size) return;
  let list=stockList.slice();
  const sel=it=>selected.has(it.id);
  if(where==="top"){ list=[...list.filter(sel), ...list.filter(it=>!sel(it))]; }
  else if(where==="bottom"){ list=[...list.filter(it=>!sel(it)), ...list.filter(sel)]; }
  else if(where==="up"){ for(let i=1;i<list.length;i++){ if(sel(list[i])&&!sel(list[i-1])){ [list[i-1],list[i]]=[list[i],list[i-1]]; } } }
  else if(where==="down"){ for(let i=list.length-2;i>=0;i--){ if(sel(list[i])&&!sel(list[i+1])){ [list[i+1],list[i]]=[list[i],list[i+1]]; } } }
  reorderMaster(list); saveOrder();
}
/* ---- 드래그로 한 줄씩 이동 ---- */
function dragStart(e,i){ dragFrom=i; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",String(i));}catch(x){} }
function dragOver(e,i){ if(dragFrom<0) return; e.preventDefault(); const rows=document.querySelectorAll("#rows tr"); rows.forEach(r=>r.classList.remove("drop-target")); if(rows[i]) rows[i].classList.add("drop-target"); }
function dragDrop(e,i){ e.preventDefault(); if(dragFrom<0||dragFrom===i){ dragEnd(); return; } const list=stockList.slice(); const [m]=list.splice(dragFrom,1); list.splice(i,0,m); reorderMaster(list); dragFrom=-1; saveOrder(); }
function dragEnd(){ dragFrom=-1; document.querySelectorAll("#rows tr").forEach(r=>r.classList.remove("drop-target")); }

/* ---- 열 너비 조절 ---- */
function startResize(e, i){
  e.preventDefault();
  const startX = e.touches? e.touches[0].clientX : e.clientX;
  const startW = stockW[i];
  const cols = document.getElementById("cg").children;
  document.body.classList.add("resizing");
  function move(ev){
    const x = ev.touches? ev.touches[0].clientX : ev.clientX;
    const w = Math.max(44, Math.round(startW + (x-startX)));
    stockW[i]=w;
    if(cols[i+1]) cols[i+1].style.width=w+"px";   // cols[0]은 체크박스 칸 → 데이터열은 i+1
    document.getElementById("tbl").style.width = (CHK_W + stockW.reduce((a,b)=>a+b,0))+"px";
  }
  function up(){
    document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);
    document.removeEventListener("touchmove",move); document.removeEventListener("touchend",up);
    document.body.classList.remove("resizing");
    saveW();
  }
  document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
  document.addEventListener("touchmove",move,{passive:false}); document.addEventListener("touchend",up);
}

/* ---- 엑셀 다운로드 (실사용) ---- */
function sheetForDept(dept){
  const rows=[["부서/분류","품목","규격","현재수량","보관위치"]];
  items.filter(i=>!i.deleted && i.dept===dept)
    .sort((a,b)=> (a.cat||"").localeCompare(b.cat||"","ko") || (a.name||"").localeCompare(b.name||"","ko"))
    .forEach(it=> rows.push([`${it.dept} / ${it.cat||""}`.trim(), it.name, it.spec||"", `${qtyOf(it)} ${it.unit||""}`.trim(), it.loc||""]));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:22},{wch:28},{wch:14},{wch:12},{wch:18}];
  return ws;
}
function exportXlsx(){
  if(typeof XLSX==="undefined"){ alert("엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결 상태에서 다시 시도하거나, 배포된 주소(github.io)에서 사용해주세요."); return; }
  const wb=XLSX.utils.book_new();
  const targets = filterDept==="전체" ? DEPTS : [filterDept];
  let added=0;
  targets.forEach(d=>{
    if(items.some(i=>!i.deleted && i.dept===d)){ XLSX.utils.book_append_sheet(wb, sheetForDept(d), d); added++; }
  });
  if(!added){ alert("다운로드할 품목이 없어요."); return; }
  const tag = filterDept==="전체" ? "전체" : filterDept;
  XLSX.writeFile(wb, `에브리업재고_${tag}_${today()}.xlsx`);
}

/* ================= 클라우드 연결 (구글시트) ================= */
const CLOUD = {
  EXEC_URL: "https://script.google.com/macros/s/AKfycbzG7Yxwc6VyDZnH5zYmWCLIDfVU1CU4Zv1z-xLByJPOTY7gLebgGp3YXaW1S9BPT2QG0A/exec",     // ★ Apps Script 배포 후 받은 /exec 주소를 따옴표 안에 붙여넣으세요
  REFRESH_MS: 30000 // 30초마다 다른 사람 입력 반영
};
let syncedOK = false;   // 최초 불러오기 성공 전에는 저장 금지(데이터 보호)
let pushing  = false;
let lastEditAt = 0;     // 마지막으로 내가 수정한 시각(자동 새로고침이 덮어쓰지 않게 보호)
function cloudOn(){ return !!CLOUD.EXEC_URL; }
function setStatus(state,msg){ const el=document.getElementById("syncpill"); if(!el) return; el.className="syncpill "+state; el.textContent=msg; }

function pullCloud(initial){
  if(!cloudOn()) return;
  const cb="cb_"+Date.now();
  window[cb]=(data)=>{
    try{ delete window[cb]; }catch(e){}
    const sc=document.getElementById(cb); if(sc) sc.remove();
    try{
      const obj=(typeof data==="string")?JSON.parse(data):data;
      const arr=(obj&&Array.isArray(obj.items))?obj.items.map(x=>Object.assign({logs:[],baseTs:0},x)):[];
      if(arr.length>0){ items=arr; syncedOK=true; setStatus("ok","연결됨"); render(); }
      else if(initial){ items=seed(); syncedOK=true; setStatus("ok","연결됨"); render(); pushOp({type:"full", items}); } // 시트가 비어있으면 현재 215개로 초기화
      else { syncedOK=true; setStatus("ok","연결됨"); }
    }catch(err){ setStatus("err","불러오기 오류"); }
  };
  const s=document.createElement("script"); s.id=cb;
  s.src=CLOUD.EXEC_URL+(CLOUD.EXEC_URL.includes("?")?"&":"?")+"callback="+cb+"&t="+Date.now();
  s.onerror=()=>{ setStatus("err","연결 실패"); const x=document.getElementById(cb); if(x) x.remove(); };
  document.body.appendChild(s);
}
function pushOp(op){
  if(!cloudOn()) return;
  if(!syncedOK){ setStatus("err","연결 안됨·저장X"); return; }  // 불러오기 실패 상태면 저장하지 않음
  pushing=true; setStatus("saving","저장 중…");
  const body=JSON.stringify(op);
  const go=(retry)=>fetch(CLOUD.EXEC_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body})
    .then(()=>{ pushing=false; setStatus("ok","저장됨"); })
    .catch(()=>{ if(retry>0) return go(retry-1); pushing=false; setStatus("err","저장 실패"); });
  go(1);
}
// 바뀐 품목 하나만 저장 (다른 사람이 고친 다른 품목은 건드리지 않음)
function saveItem(it){ lastEditAt=Date.now(); render(); if(it) pushOp({type:"upsert", item: it}); }
// 순서만 저장
function saveOrder(){ lastEditAt=Date.now(); render(); pushOp({type:"order", ids: items.map(x=>x.id)}); }
function reloadNow(){ if(!cloudOn()) return; setStatus("saving","새로고침…"); pullCloud(false); }
function scheduleRefresh(){
  if(!cloudOn()) return;
  setInterval(()=>{
    if(pushing) return;
    if(Date.now()-lastEditAt < 60000) return;                                 // 최근 1분 내 내가 수정했으면 덮어쓰지 않음
    if(document.getElementById("overlay").classList.contains("show")) return; // 입력창 열려있으면 건너뜀
    if(selected.size) return;                                                 // 순서 정렬 중이면 건너뜀
    pullCloud(false);
  }, CLOUD.REFRESH_MS);
}

/* ---- 시작 ---- */
try{
  document.getElementById("asof").textContent="오늘 "+today();
  loadW();
  if(cloudOn()){
    document.getElementById("demoBanner").style.display="none";
    document.getElementById("refreshBtn").style.display="";
    setStatus("saving","불러오는 중…");
    render();
    pullCloud(true);
    scheduleRefresh();
  }else{
    setStatus("off","미리보기");
    render();
  }
}catch(err){
  console.error(err);
  try{ setStatus("err","오류"); }catch(e){}
  const emp=document.getElementById("empty");
  if(emp){ emp.style.display="block"; emp.innerHTML="<b>화면을 그리는 중 문제가 발생했어요</b>"+String((err&&err.message)||err); }
}
</script>
